name: Publish npm

# The headless CLI (packages/cli) goes to npm as `@ghostlytools/cli` (the npm
# organization `ghostlytools`; the command is `ghostly`) once its release
# is published: a person publishing the draft (docs/RELEASING.md, step 4)
# starts this workflow. A security autorelease publishes its release with the
# workflow token, which starts nothing, so security-autorelease.yml dispatches
# this workflow itself. A tag can also be (re)published by hand:
#   gh workflow run npm-publish.yml -f tag=v1.0.0
#
# Authentication is npm trusted publishing (OIDC): no long-lived token. npm
# only lets a package that already exists trust a workflow, so the very first
# publish uses the NPM_TOKEN repository secret; once the package is on npm and
# trusts this workflow, delete that secret. See docs/RELEASING.md.
#
# Only the two publish jobs can ask for an OIDC token, and both run in the
# `npm` environment, which each package's Trusted Publisher names. The checks
# that install from npm run in jobs of their own, without a token. So do the
# installs and builds from the lockfile: `build-cli` and `verify-sdk` check out
# the tag, install, build and keep a tarball, and each publish job publishes
# that very file, with no checkout, install, build or script.
#
# A scoped package is private by default: `--access public` here and
# `publishConfig.access` in packages/cli/package.json both make it public.
#
# The SDK (packages/sdk, `@ghostlytools/sdk`, with the mini-app types at
# `@ghostlytools/sdk/app`) goes out from the same release in jobs of its own,
# so a problem there never holds the CLI back. `verify-sdk` (no token) runs
# `npm run test:sdk-example` on the tag and keeps the tarball it checked;
# `publish-sdk` publishes that very file, with no checkout, install, build or
# script. It is not on npm yet: it publishes only once the repository
# variable SDK_NPM_PUBLISH is "true", which the owner sets when he makes the
# first publish (docs/RELEASING.md, "npm trusted publishing"). Until then it
# says so in the run's summary and stops.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # The CLI is installed, built and packed here, with no token: every install script and build tool of the lockfile
  # runs in this job. The tarball it packed is the one publish publishes.
  build-cli:
    name: "@ghostlytools/cli: build the tarball"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: The tag is the package's version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::packages/cli/package.json is $version, the release is $TAG: nothing published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@ghostlytools/cli@$version" version >/dev/null 2>&1; then
            echo "@ghostlytools/cli@$version is already on npm." >> "$GITHUB_STEP_SUMMARY"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.published == 'false'
        run: npm ci

      - name: Build
        if: steps.version.outputs.published == 'false'
        run: npm run build -w @ghostlytools/cli

      - name: Pack the tarball
        if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli"
          npm pack --workspace @ghostlytools/cli --pack-destination "$RUNNER_TEMP/cli"
          sha256sum "$RUNNER_TEMP/cli/ghostlytools-cli-$VERSION.tgz" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        if: steps.version.outputs.published == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostlytools-cli
          path: ${{ runner.temp }}/cli/ghostlytools-cli-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  # The only CLI job with a token: no checkout, install, build or script. It publishes the file build-cli packed.
  publish:
    name: "@ghostlytools/cli to npm"
    needs: build-cli
    if: needs.build-cli.outputs.published == 'false'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # The OIDC token for trusted publishing and the provenance statement.
      id-token: write
    env:
      VERSION: ${{ needs.build-cli.outputs.version }}
    steps:
      # Trusted publishing needs npm 11.5.1+ and Node 22.14+: Node 24 ships both. No cache: there is no lockfile here.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ghostlytools-cli
          path: ${{ runner.temp }}/cli

      - name: The tarball is the package and version built
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/cli/ghostlytools-cli-$VERSION.tgz"
          sha256sum "$tarball"
          tar -xzOf "$tarball" package/package.json > "$RUNNER_TEMP/cli-package.json"
          node -e 'const p = require(process.argv[1]); process.exit(p.name === "@ghostlytools/cli" && p.version === process.env.VERSION ? 0 : 1)' "$RUNNER_TEMP/cli-package.json"

      - name: Publish
        env:
          # Only for the first publish (see the top of this file); empty afterwards, and npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/cli/ghostlytools-cli-$VERSION.tgz" --provenance --access public --ignore-scripts

  # What a person gets from `npm install -g @ghostlytools/cli`, in a job with no token: the registry can take a moment
  # to serve a new version. It runs too when the version was on npm already.
  check-cli:
    name: "@ghostlytools/cli installs from npm"
    needs: [build-cli, publish]
    if: ${{ !cancelled() && needs.build-cli.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Installs and runs from npm
        env:
          VERSION: ${{ needs.build-cli.outputs.version }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          for attempt in $(seq 1 12); do
            if npm install --no-audit --no-fund --prefer-online "@ghostlytools/cli@$VERSION"; then break; fi
            if [[ "$attempt" == 12 ]]; then echo "::error::@ghostlytools/cli@$VERSION does not install from npm"; exit 1; fi
            sleep 20
          done
          node_modules/.bin/ghostly --version | tee version.json
          node -e "process.exit(require('./version.json').version === process.env.VERSION ? 0 : 1)"
          echo "@ghostlytools/cli@$VERSION: https://www.npmjs.com/package/@ghostlytools/cli/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The pull requests' gate again, on the tag, with no token: the tarball installs into the example adapter (contract
  # suites, whose dependencies come from the registry) and the example mini-app (type checks against /app, whose
  # JavaScript imports nothing). The tarball it checked is the one publish-sdk publishes.
  verify-sdk:
    name: "@ghostlytools/sdk: check the tarball"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ENABLED: ${{ vars.SDK_NPM_PUBLISH == 'true' }}
    outputs:
      on: ${{ steps.enabled.outputs.on }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - name: Publishing the SDK is on
        id: enabled
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != "true" ]]; then
            echo "@ghostlytools/sdk: not published, the repository variable SDK_NPM_PUBLISH is not \"true\" (docs/RELEASING.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.enabled.outputs.on == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.enabled.outputs.on == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: The tag is the package's version
        if: steps.enabled.outputs.on == 'true'
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/sdk/package.json').version")
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::packages/sdk/package.json is $version, the release is $TAG: nothing published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@ghostlytools/sdk@$version" version >/dev/null 2>&1; then
            echo "@ghostlytools/sdk@$version is already on npm." >> "$GITHUB_STEP_SUMMARY"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.enabled.outputs.on == 'true' && steps.version.outputs.published == 'false'
        run: npm ci

      # `npm pack` builds the package into packages/sdk/examples/adapter/vendor/ghostly-sdk.tgz, which both examples install.
      - name: The tarball works outside the repository
        if: steps.enabled.outputs.on == 'true' && steps.version.outputs.published == 'false'
        run: npm run test:sdk-example

      - name: Keep the tarball it checked
        if: steps.enabled.outputs.on == 'true' && steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          cp packages/sdk/examples/adapter/vendor/ghostly-sdk.tgz "$RUNNER_TEMP/sdk/ghostlytools-sdk-$VERSION.tgz"
          sha256sum "$RUNNER_TEMP/sdk/ghostlytools-sdk-$VERSION.tgz" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        if: steps.enabled.outputs.on == 'true' && steps.version.outputs.published == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostlytools-sdk
          path: ${{ runner.temp }}/sdk/ghostlytools-sdk-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  # The only SDK job with a token: no checkout, install, build or script. It publishes the file verify-sdk checked.
  publish-sdk:
    name: "@ghostlytools/sdk to npm"
    needs: verify-sdk
    if: needs.verify-sdk.outputs.on == 'true' && needs.verify-sdk.outputs.published == 'false'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # The OIDC token for trusted publishing and the provenance statement.
      id-token: write
    env:
      VERSION: ${{ needs.verify-sdk.outputs.version }}
    steps:
      # Trusted publishing needs npm 11.5.1+ and Node 22.14+: Node 24 ships both. No cache: there is no lockfile here.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ghostlytools-sdk
          path: ${{ runner.temp }}/sdk

      - name: The tarball is the package and version checked
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/sdk/ghostlytools-sdk-$VERSION.tgz"
          sha256sum "$tarball"
          tar -xzOf "$tarball" package/package.json > "$RUNNER_TEMP/sdk-package.json"
          node -e 'const p = require(process.argv[1]); process.exit(p.name === "@ghostlytools/sdk" && p.version === process.env.VERSION ? 0 : 1)' "$RUNNER_TEMP/sdk-package.json"

      - name: Publish
        env:
          # Only for the first publish (see the top of this file); empty afterwards, and npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/sdk/ghostlytools-sdk-$VERSION.tgz" --provenance --access public --ignore-scripts

  # What a mini-app gets from `npm install @ghostlytools/sdk`, in a job with no token: the registry can take a moment to
  # serve a new version. It runs too when the version was on npm already.
  check-sdk:
    name: "@ghostlytools/sdk installs from npm"
    needs: [verify-sdk, publish-sdk]
    if: ${{ !cancelled() && needs.verify-sdk.result == 'success' && needs.verify-sdk.outputs.on == 'true' && (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Installs from npm
        env:
          VERSION: ${{ needs.verify-sdk.outputs.version }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          for attempt in $(seq 1 12); do
            if npm install --no-audit --no-fund --prefer-online "@ghostlytools/sdk@$VERSION"; then break; fi
            if [[ "$attempt" == 12 ]]; then echo "::error::@ghostlytools/sdk@$VERSION does not install from npm"; exit 1; fi
            sleep 20
          done
          node --input-type=module -e 'const app = await import("@ghostlytools/sdk/app"); process.exit(Array.isArray(app.MINI_APP_ERROR_CODES) ? 0 : 1)'
          echo "@ghostlytools/sdk@$VERSION: https://www.npmjs.com/package/@ghostlytools/sdk/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
