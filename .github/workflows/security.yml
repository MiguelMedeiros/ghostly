name: Security

# Known vulnerabilities in dependencies, on every change and every morning:
# new advisories appear without anyone touching the lock files.
on:
  push:
    branches: [main, "claude/security-auto-**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency advisories (OSV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # package-lock.json, website/package-lock.json and Cargo.lock against osv.dev.
      # Accepted advisories live in .github/security-allowlist.json, each with an expiry.
      - name: Scan lock files
        run: node scripts/security-scan.mjs
