name: E2E (full)

# Every end-to-end suite, the gated ones included, against e2e/infra: one Docker Compose project with a regtest
# chain, Ark and Bark servers, LND and Core Lightning nodes, Alby Hubs, Anvil, an S3 server and the Cashu test mint —
# worthless coins and throwaway keys, all on this runner, so no secrets. `npm run e2e:full` brings it up, funds
# it, runs the gated vitest contracts and the web and extension suites, and takes it down (see e2e/README.md).
# Breez's hosted regtest is not part of it: its faucet needs a reCAPTCHA, so those suites are skipped here.
# Nightly on dev and by hand; not on pull requests, on purpose: it takes far longer than a merge should wait.
# Measured on ubuntu-24.04 (2026-09-24): about 42 minutes — the environment up and funded in under a minute,
# the vitest contracts in 37 s, Playwright (2 workers, one retry) in 39 minutes.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      playwright_args:
        description: "Only some of it, e.g. --project=web e2e/web/wallet-lnd.spec.ts (empty: everything)"
        required: false
        type: string
      jobs:
        description: "Which jobs: all of them, desktop (the Desktop scenarios and specs, and the matrix report), or matrix (the four browser shards and the report)"
        required: false
        type: choice
        options: [all, desktop, matrix]
        default: all

permissions:
  contents: read

concurrency:
  group: e2e-full
  cancel-in-progress: false

jobs:
  e2e-full:
    name: End-to-end, gated suites included
    # Not when only the Desktop jobs or the matrix were asked for (a scheduled run has no inputs: everything).
    if: ${{ inputs.jobs != 'desktop' && inputs.jobs != 'matrix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled run tests dev, the default branch; a manual one, the branch it was started on.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false

      # The test ports (47000-47399: the environment, the web build under test and the test process's own servers,
      # the matrix's build and its test domain) sit inside Linux's ephemeral range (32768-60999), so an outgoing
      # connection could hold one as its local port when a server starts there ("Port 47300 is already in use", run
      # 36688192932). Reserved, they are never given to a connection, and a server still binds them.
      - name: Keep the test ports out of the ephemeral range
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=47000-47399
          echo "Ephemeral range: $(cat /proc/sys/net/ipv4/ip_local_port_range)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium

      # Before the clock of the run itself: a slow registry is not a slow test.
      - name: Pull the environment's images
        run: |
          for attempt in 1 2 3; do
            docker compose -p ghostly-e2e -f e2e/infra/docker-compose.yml pull --quiet --ignore-buildable && exit 0
            echo "pull failed (attempt $attempt), retrying"; sleep 15
          done
          exit 1

      - name: Run everything
        env:
          PLAYWRIGHT_ARGS: ${{ inputs.playwright_args }}
        # PLAYWRIGHT_ARGS is split on spaces on purpose: it is a list of arguments.
        run: npm run e2e:full -- -- $PLAYWRIGHT_ARGS

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-full
          path: |
            playwright-report
            test-results
          retention-days: 14

  # The combination matrix (e2e/matrix/): every pair of clients, transport, delivery, wallet, rail, proof, group,
  # profile, language and screen, as whole stories between two people, on the same environment. Four shards,
  # each with its own copy of the environment; the report job merges them into one HTML report and puts the
  # matrix (combination → result) in the run's summary. A scenario whose block needs something the environment
  # does not have is reported as partial, not failed.
  matrix:
    name: Combination matrix (${{ matrix.shard }}/4)
    # Not when only the Desktop jobs were asked for (a scheduled run has no inputs: everything).
    if: ${{ inputs.jobs != 'desktop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false

      # The test ports (47000-47399: the environment, the web build under test and the test process's own servers,
      # the matrix's build and its test domain) sit inside Linux's ephemeral range (32768-60999), so an outgoing
      # connection could hold one as its local port when a server starts there ("Port 47300 is already in use", run
      # 36688192932). Reserved, they are never given to a connection, and a server still binds them.
      - name: Keep the test ports out of the ephemeral range
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=47000-47399
          echo "Ephemeral range: $(cat /proc/sys/net/ipv4/ip_local_port_range)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium

      - name: Pull the environment's images
        run: |
          for attempt in 1 2 3; do
            docker compose -p ghostly-e2e -f e2e/infra/docker-compose.yml pull --quiet --ignore-buildable && exit 0
            echo "pull failed (attempt $attempt), retrying"; sleep 15
          done
          exit 1

      - name: Start the environment
        run: npm run e2e:infra:up

      # The Desktop scenarios run in their own job (matrix-desktop): they need the app built, not the environment.
      - name: Run shard ${{ matrix.shard }} of the matrix
        env:
          MATRIX_WORKERS: "2"
        run: npm run e2e:matrix -- --shard ${{ matrix.shard }}/4 --grep-invert @clients:desktop

      - name: Stop the environment
        if: ${{ always() }}
        run: npm run e2e:infra:down

      - name: Upload the shard's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-blob-${{ matrix.shard }}
          path: blob-report-matrix
          retention-days: 3

  # The matrix's Desktop scenarios (desktop-web, desktop-desktop): the bundled app driven through tauri-driver,
  # which only Linux and Windows can do (macOS has no WebDriver for WKWebView), two apps side by side with a home
  # each. Their peers meet on the test's relay (GHOSTLY_PKARR_RELAYS) and a HyperDHT testnet in the test process
  # (GHOSTLY_HYPERDHT_BOOTSTRAP), so nothing here needs e2e/infra or the network. The runner and the build are the
  # E2E workflow's Desktop job's (ubuntu-22.04, `tauri build --debug --no-bundle`).
  matrix-desktop:
    name: Combination matrix (Desktop)
    # Not when only the browser matrix was asked for.
    if: ${{ inputs.jobs != 'matrix' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # gstreamer1.0-plugins-good: WebKitGTK's VP9 decoder, for the large-video check (e2e/desktop/video-stream.spec.ts).
      # PulseAudio: the named test microphones and speakers of e2e/desktop/call-devices.spec.ts.
      # Sway and wl-clipboard: a headless Wayland clipboard for e2e/desktop/wayland-clipboard.spec.ts.
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
        librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb pulseaudio
        gstreamer1.0-pulseaudio sway wl-clipboard

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false

      # The test ports (47000-47399: the environment, the web build under test and the test process's own servers,
      # the matrix's build and its test domain) sit inside Linux's ephemeral range (32768-60999), so an outgoing
      # connection could hold one as its local port when a server starts there ("Port 47300 is already in use", run
      # 36688192932). Reserved, they are never given to a connection, and a server still binds them.
      - name: Keep the test ports out of the ephemeral range
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=47000-47399
          echo "Ephemeral range: $(cat /proc/sys/net/ipv4/ip_local_port_range)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # The .deb files apt fetched for APT_PACKAGES on this runner image, as the Tauri job does in ci.yml (#808): apt-get
      # update and the download from the mirror are the slow and variable part (28 to 101 s here). One entry per runner
      # image (a new image has other versions already installed, so it needs another set) and package list, shared with
      # the other Desktop e2e job that has the same list. Saved on a miss, whatever the tests do after.
      - name: Apt cache key
        id: apt-key
        run: echo "key=${ImageOS}-${ImageVersion}-apt-desktop-e2e-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      # In the background, while Rust, the Cargo cache and npm ci come in; "Wait for the system dependencies" joins it.
      # Both paths install the same way, from the .deb files, so a cached run and a fresh one test the same thing.
      - name: Install system dependencies
        env:
          CACHED: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          {
            debs="$RUNNER_TEMP/apt-debs"
            # needrestart's scan, the man-db index and dpkg's fsyncs add time and nothing to a runner thrown away after.
            apt_get() { sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get -y "$@"; }
            sudo rm -f /var/lib/man-db/auto-update
            echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/99-unsafe-io > /dev/null
            echo "$(date +%T) remove libunwind-14-dev"
            # GStreamer's headers (calls on Linux, apps/desktop/src/native_call) need libunwind-dev, which the
            # runner image's libunwind-14-dev (LLVM's) blocks.
            apt_get remove libunwind-14-dev || true
            if [[ "$CACHED" != "true" ]]; then
              echo "$(date +%T) update"
              apt_get update
              echo "$(date +%T) download"
              mkdir -p "$debs/partial"
              # shellcheck disable=SC2086
              apt_get install --download-only -o Dir::Cache::Archives="$debs" $APT_PACKAGES
              sudo rm -rf "$debs/partial" "$debs/lock"
            fi
            echo "$(date +%T) install $(ls "$debs" | wc -l) packages, $(du -sh "$debs" | cut -f1)"
            apt_get install "$debs"/*.deb
            echo "$(date +%T) done"
          } > "$RUNNER_TEMP/apt.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apt.pid"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-desktop-e2e-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-e2e-${{ github.repository }}-

      - name: Install dependencies
        run: npm ci

      - name: Wait for the system dependencies
        run: |
          pid=$(cat "$RUNNER_TEMP/apt.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2} ' "$RUNNER_TEMP/apt.log" || true
          tail -n 5 "$RUNNER_TEMP/apt.log"
          # The exit status of a process that is not this shell's child is gone: check the result instead.
          # shellcheck disable=SC2086
          dpkg -s $APT_PACKAGES > /dev/null

      - name: Save the system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      # After the wait: were a library missing, its apt-get would race the one above for dpkg's lock.
      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium

      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked

      # Also installs the HyperDHT runtime (tools/scripts/prepare-native-runtime.mjs), whose testnet the scenarios use.
      - name: Build the Desktop app
        run: npm run tauri -- build --debug --no-bundle

      - name: Run the Desktop scenarios
        env:
          MATRIX_WORKERS: "2"
        run: xvfb-run -a npm run e2e:matrix -- --no-build --grep @clients:desktop

      # The Desktop specs as well (e2e/desktop/, the E2E workflow's Desktop job), whatever the scenarios did: the
      # app is built already, and two Desktop apps going live on Iroh or HyperDHT from the DHT
      # (native-upgrade.spec.ts) should not wait for a release to be checked.
      - name: Run the Desktop specs
        if: ${{ !cancelled() }}
        run: xvfb-run -a npm run test:e2e:desktop

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-blob-desktop
          path: blob-report-matrix
          retention-days: 3

      - name: Upload the Desktop specs' report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-desktop
          path: |
            playwright-report-desktop
            test-results/desktop
          retention-days: 14

  matrix-report:
    name: Combination matrix report
    needs: [matrix, matrix-desktop]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download the shards' results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: matrix-blob-*
          path: blob-report-matrix
          merge-multiple: true

      # The config's reporters, once over every shard: the HTML report and the matrix summary (reporter.ts).
      - name: Merge the report
        run: npx playwright merge-reports -c e2e/playwright.matrix.config.ts blob-report-matrix

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-matrix
          path: |
            playwright-report-matrix
            test-results/matrix-summary
          retention-days: 14
