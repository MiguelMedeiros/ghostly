name: Merge queue

# Runs the merge train (tools/scripts/merge-train.mjs): pull requests labelled `queue` land on their base (dev or an
# epic/* branch) in batches of up to 12, in the order they were queued (`queue:priority` first). Each run moves every
# base's train one step: board a batch, merge a green one, split a red one, and update each queued pull request's
# place in line. See docs/TESTING.md#the-merge-queue.
#
# It acts as a GitHub App (repository secrets QUEUE_APP_ID and QUEUE_APP_PRIVATE_KEY): GitHub starts no workflow for a
# push or a pull request made with the workflow's own GITHUB_TOKEN, so a batch made with it would never get its CI
# Success. Without those secrets every run ends green with a notice and changes nothing; a Mac can run the train
# meanwhile (`node tools/scripts/merge-train.mjs --run --every 300`, with its own gh login).
#
# These runs hold the app's key, so they always run the default branch's copy of the script (both checkouts pin it),
# never a pull request's: there is no pull_request trigger, and pull_request_target (a label added) and pushes take
# this file from dev or an epic, which only writers change. The train only merges pull requests' commits with git;
# it never runs their code.

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [dev, "epic/**"]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide and log, change nothing
        type: boolean
        default: false
      base:
        description: Only this base (dev, epic/<name>); empty for every base with a train
        type: string
        default: ""

permissions: {}

jobs:
  bases:
    name: Bases with a train
    # A pull request's CI ending can turn a batch or a queued pull request green; CI on a push already ran this. A label
    # matters only when it is one of the train's. A push matters when a person moved the base: the train's own pushes
    # (a batch lands as one squash merge per pull request) come from the run that goes on by itself.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request') &&
      (github.event_name != 'pull_request_target' || startsWith(github.event.label.name, 'queue')) &&
      (github.event_name != 'push' || github.event.sender.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      configured: ${{ steps.app.outputs.configured }}
      bases: ${{ steps.list.outputs.bases }}
    steps:
      - name: Check the queue app
        id: app
        env:
          APP_ID: ${{ secrets.QUEUE_APP_ID }}
          APP_KEY: ${{ secrets.QUEUE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo "::notice::queue app not configured"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the script
        if: steps.app.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/scripts/merge-train.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: List the bases
        id: list
        if: steps.app.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
        # The assignment on its own line, so a failing --list-bases fails this step (inside `echo` it would not).
        run: |
          if [[ -n "$BASE" ]]; then
            bases=$(jq -cn --arg b "$BASE" '[$b]')
          else
            bases=$(node tools/scripts/merge-train.mjs --list-bases)
          fi
          echo "bases=$bases" >> "$GITHUB_OUTPUT"

  train:
    name: Train into ${{ matrix.base }}
    needs: bases
    if: needs.bases.outputs.configured == 'true' && needs.bases.outputs.bases != '' && needs.bases.outputs.bases != '[]'
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.bases.outputs.bases || '[]') }}
    # One run per base at a time, and at most one waiting behind it (GitHub cancels the extra waiting ones, which is not
    # a failure). Bases never wait on each other.
    concurrency:
      group: merge-train-${{ matrix.base }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Nothing here uses the workflow's own token: the checkout and the train act as the queue app.
    permissions: {}
    steps:
      # The train reads CI from the jobs of ci.yml's own run ("Actions: read": a check run named "CI Success" can be
      # posted by any workflow of the repository) and cancels a boarded pull request's own CI run, which frees runners
      # for the batch ("Actions: write"). GitHub refuses a token that asks for more than the app has, so it falls back:
      # Actions write -> Actions read (no cancelling; the train says so once) -> no Actions (CI from check runs; the
      # train warns in its log).
      - name: App token
        id: token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUEUE_APP_ID }}
          private-key: ${{ secrets.QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-actions: write

      - name: App token (Actions read)
        id: token-read
        if: steps.token.outcome == 'failure'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUEUE_APP_ID }}
          private-key: ${{ secrets.QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-actions: read

      - name: App token (no Actions read)
        id: token-checks
        if: steps.token.outcome == 'failure' && steps.token-read.outcome != 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUEUE_APP_ID }}
          private-key: ${{ secrets.QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read

      # Full history without file contents: batches merge pull requests onto the base, which needs their merge bases.
      # The app's token stays in the checkout so the batch push starts CI.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.token.outputs.token || steps.token-read.outputs.token || steps.token-checks.outputs.token }}
          fetch-depth: 0
          filter: blob:none

      - name: Run the train
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || steps.token-read.outputs.token || steps.token-checks.outputs.token }}
          # The train trusts only its own position comments: the ones this app's bot wrote.
          MERGE_TRAIN_LOGIN: ${{ steps.token.outputs.app-slug || steps.token-read.outputs.app-slug || steps.token-checks.outputs.app-slug }}[bot]
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          BASE: ${{ matrix.base }}
        run: |
          git config user.name "ghostly-merge-train"
          git config user.email "merge-train@users.noreply.github.com"
          if [[ "$DRY_RUN" == "true" ]]; then mode=--dry-run; else mode=--run; fi
          node tools/scripts/merge-train.mjs "$mode" --base "$BASE"
