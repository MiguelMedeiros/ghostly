name: Android

# The Android app: app.ghostly.tools in a Trusted Web Activity, built with Bubblewrap (docs/ANDROID.md).
# Run by hand (Actions > Android > Run workflow), by a pull request that changes it, and by release.yml.
# With the upload key in the repository's secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) it builds a signed release APK; without them, or on a pull request,
# a debug APK signed with the Android debug key, to try the app and never to publish.
on:
  pull_request:
    # ready_for_review: a draft skips this (see the apk job); leaving draft builds it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/android-twa/**"
      - "apps/desktop/icons/android/**"
      - "apps/web/public/manifest.json"
      - "apps/web/public/icon-*.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "What to build (a tag); the caller's ref when empty"
        required: false
        default: ""
        type: string
    outputs:
      signed:
        description: "true when the APK is signed with the upload key"
        value: ${{ jobs.apk.outputs.signed }}

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Build Android APK
    # A draft gets CI's fast tier only (ci.yml, `changes`): this builds once the pull request leaves draft
    # (ready_for_review) and on every push after. From the event, unlike ci.yml and android-native.yml, which read the
    # API: release.yml calls this with contents: read only, and a job here asking for pull-requests: read would stop
    # the release from starting. The cost: a push and `gh pr ready` a second apart may leave only the push's run,
    # whose event still says draft (#742); the next push builds it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.build.outputs.signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Bubblewrap 1.25.0's project uses Android Gradle Plugin 8.9 (JDK 17) and compiles against API 36.
      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Build
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$KEYSTORE_B64" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.keystore"
            (umask 077 && printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE")
            apps/android-twa/build.sh release
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            apps/android-twa/build.sh debug
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      # A pull request also goes down the release path (assembleRelease, zipalign, apksigner) with a key made for
      # this run and thrown away, so a release is not the first build to try it. That APK is not uploaded.
      - name: Release path with a throwaway key
        if: github.event_name == 'pull_request'
        env:
          ANDROID_TWA_OUT: ${{ runner.temp }}/android-release-check
          ANDROID_KEYSTORE: ${{ runner.temp }}/throwaway.keystore
          ANDROID_KEY_ALIAS: throwaway
        run: |
          ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=throwaway" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1
          apps/android-twa/build.sh release
          rm -f "$ANDROID_KEYSTORE"

      - name: Size
        env:
          RELEASE_CHECK: ${{ runner.temp }}/android-release-check
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          {
            echo "### Android APK"
            echo
            for apk in apps/android-twa/build/ghostly-*.apk "$RELEASE_CHECK"/ghostly-*.apk; do
              [ -f "$apk" ] || continue
              echo "- \`$(basename "$apk")\`: $(stat -c %s "$apk") bytes ($(du -h "$apk" | cut -f1)), $("$AAPT2" dump badging "$apk" | head -1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: apps/android-twa/build/ghostly-*.apk
          if-no-files-found: error
