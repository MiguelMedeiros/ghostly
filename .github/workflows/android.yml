name: Android

# The Android app: apps/desktop built with Tauri 2 for Android (apps/desktop/gen/android, docs/ANDROID.md), one arm64
# APK. Run by hand (Actions > Android > Run workflow), by a pull request that changes it, and by release.yml.
# - With the upload key in the repository's secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): a release APK signed with it, ghostly-<version>-android-arm64.apk.
# - Without them: a DEBUG APK signed with the Android debug key, ghostly-<version>-android-arm64-debug.apk, to try
#   the app and never to publish. The job summary says which one it is, and so does the `signed` output.
# - On a pull request: the release path with a key made for the run and thrown away (nothing uploaded), so a release
#   is not the first build to try it. Debug APKs for pull requests are android-native.yml's.
on:
  pull_request:
    # ready_for_review: a draft skips this (see the apk job); leaving draft builds it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/desktop/gen/android/**"
      - "apps/desktop/tauri.android.conf.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "What to build (a tag); the caller's ref when empty"
        required: false
        default: ""
        type: string
    outputs:
      signed:
        description: "true when the APK is a release build signed with the upload key, false for a debug APK"
        value: ${{ jobs.apk.outputs.signed }}

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The NDK Tauri builds with (as android-native.yml): the runner image's default one, named so a new image cannot
  # change it quietly.
  NDK_VERSION: 27.3.13750724
  # A debug APK's library: a few hundred MB smaller, with backtraces that still name lines.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  apk:
    name: Build Android APK (arm64)
    # A draft gets CI's fast tier only (ci.yml, `changes`): this builds once the pull request leaves draft
    # (ready_for_review) and on every push after. From the event, unlike ci.yml and android-native.yml, which read the
    # API: release.yml calls this with contents: read only, and a job here asking for pull-requests: read would stop
    # the release from starting. The cost: a push and `gh pr ready` a second apart may leave only the push's run,
    # whose event still says draft (#742); the next push builds it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.build.outputs.signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # The Android Gradle Plugin of Tauri's generated project runs on JDK 17.
      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android

      # Gradle fetches the SDK platform and build tools the project asks for itself, once the licences are accepted.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The version is the Desktop app's (tauri.conf.json, the repository's); Tauri makes the version code
      # major * 1000000 + minor * 1000 + patch, so each release installs over the last.
      # A release build is signed by Gradle (gen/android/app/build.gradle.kts) when ANDROID_KEYSTORE names a keystore.
      - name: Build
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          THROWAWAY_KEY: ${{ github.event_name == 'pull_request' }}
        run: |
          version="$(node -p "require('./apps/desktop/tauri.conf.json').version")"
          if [ "$THROWAWAY_KEY" = "true" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.keystore" ANDROID_KEY_ALIAS=throwaway
            ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 1 -dname "CN=throwaway" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1
            kind=release; signed=false; name="ghostly-${version}-android-arm64-throwaway.apk"
          elif [ -n "$KEYSTORE_B64" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.keystore"
            (umask 077 && printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE")
            kind=release; signed=true; name="ghostly-${version}-android-arm64.apk"
          else
            unset ANDROID_KEYSTORE
            kind=debug; signed=false; name="ghostly-${version}-android-arm64-debug.apk"
          fi
          if [ "$kind" = release ]; then
            npm run tauri -- android build --apk --split-per-abi --target aarch64
          else
            npm run tauri -- android build --debug --apk --split-per-abi --target aarch64
          fi
          out=apps/desktop/gen/android/app/build/outputs/apk
          find "$out" -name '*.apk' -print
          apk="$(find "$out" -path "*arm64*/$kind/*" -name '*.apk' ! -name '*-unsigned.apk' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::No signed $kind APK in $out"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/$name"
          {
            echo "signed=$signed"
            echo "kind=$kind"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      # The certificate's SHA-256 fingerprint is public (it is what a phone checks an update against), not a secret.
      - name: Summary
        env:
          KIND: ${{ steps.build.outputs.kind }}
          SIGNED: ${{ steps.build.outputs.signed }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          apk="$RUNNER_TEMP/apk/$NAME"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          debuggable=no
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then debuggable=yes; fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)' > "$RUNNER_TEMP/certs.txt"
          {
            echo "### Android APK (arm64)"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "**Release build, signed with the upload key.**"
            elif [ "$KIND" = "release" ]; then
              echo "**Release path with a throwaway key** (pull request): checks the release build and its signing. Not uploaded."
            else
              echo "**DEBUG build, signed with the Android debug key: the upload key is not in this repository's secrets.** To try the app, never to publish."
            fi
            echo
            echo "- \`$NAME\`: $(stat -c %s "$apk") bytes ($(du -h "$apk" | cut -f1))"
            echo "- $(head -n1 "$RUNNER_TEMP/badging.txt")"
            echo "- debuggable: $debuggable"
            sed 's/^/- /' "$RUNNER_TEMP/certs.txt"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$KIND" = "release" ] && [ "$debuggable" = "yes" ]; then
            echo "::error::The release APK is debuggable"
            exit 1
          fi
          if [ "$KIND" = "debug" ]; then
            echo "::warning::DEBUG APK: the Android upload key is not in this repository's secrets (docs/ANDROID.md)"
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: ${{ runner.temp }}/apk/ghostly-*.apk
          if-no-files-found: error
