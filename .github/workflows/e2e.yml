name: E2E
# PROBE r11k (not for merge): WebKitGTK audio timings per runner image, with and without a sound server.
on:
  workflow_dispatch:
    inputs:
      web_url:
        required: false
        type: string
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        sound: [none, pulse]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi gir1.2-webkit2-4.1 gir1.2-gtk-3.0 xvfb pulseaudio gstreamer1.0-pulseaudio gstreamer1.0-plugins-good dbus-x11 >/dev/null
      - run: dpkg -l | grep -E "libwebkit2gtk-4.1-0|libgstreamer1.0-0 " | awk '{print $2, $3}'
      - name: Probe
        run: |
          if [ "${{ matrix.sound }}" = pulse ]; then
            D=$(mktemp -d); export PULSE_SERVER=unix:$D/native
            HOME=$D XDG_RUNTIME_DIR=$D pulseaudio -n --daemonize=yes --exit-idle-time=-1 --use-pid-file=no -L "module-native-protocol-unix socket=$D/native auth-anonymous=1" -L module-null-sink
            sleep 2
          fi
          dbus-run-session -- xvfb-run -a python3 tools/probe/webkit_audio_probe2.py
