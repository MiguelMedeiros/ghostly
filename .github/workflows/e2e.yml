name: E2E

# Real browsers against the shipped build of the web app and the extension.
# Peers meet through a relay inside the test process, so nothing here depends
# on outside services except the tests tagged @network (the public Cashu test mint).
# Pull requests and pushes run it as part of CI (ci.yml); releases run it first (release.yml).
on:
  schedule:
    # Every night, so a change in a browser or in the test mint shows up before a release does.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      web_url:
        description: "Test a deployed web app instead of a fresh build (e.g. https://app.ghostly.tools). Web tests only."
        required: false
        type: string
  workflow_call:

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: ${{ !inputs.web_url }}
        run: npm run test:e2e

      - name: Run end-to-end tests against ${{ inputs.web_url }}
        if: ${{ inputs.web_url }}
        env:
          E2E_WEB_URL: ${{ inputs.web_url }}
        run: npx playwright test -c e2e/playwright.config.ts --project=web

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
