name: E2E

# Real browsers against the shipped build of the web app and the extension, and
# the real Desktop app driven through WebDriver.
# Peers meet through a relay inside the test process, so nothing here depends
# on outside services except the tests tagged @network (the public Cashu test mint).
# Too slow to hold up every pull request: it runs before each release (release.yml
# calls it and ships nothing unless it passes), and by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Test a deployed web app instead of a fresh build (e.g. https://app.ghostly.tools). Web tests only."
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "What to test: the tag being released"
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: ${{ !inputs.web_url }}
        run: npm run test:e2e

      - name: Run end-to-end tests against ${{ inputs.web_url }}
        if: ${{ inputs.web_url }}
        env:
          E2E_WEB_URL: ${{ inputs.web_url }}
        run: npx playwright test -c e2e/playwright.config.ts --project=web

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Ghostly Desktop, driven through WebDriver by tauri-driver: the bundled app,
  # nothing added to it to make it testable. Linux only — macOS has no WebDriver
  # for WKWebView — so this is where Desktop is covered at all. Its own job, so
  # a Rust build never holds up the browser tests.
  desktop:
    name: Desktop (Tauri)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # The deployed-web-app run has no Desktop app to speak of.
    if: ${{ !inputs.web_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-desktop-e2e-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-e2e-${{ github.repository }}-

      - name: Install dependencies
        run: npm ci

      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked

      # `tauri build` and not `cargo build`: a plain cargo debug build points the
      # WebView at the dev server. `--debug` keeps the compile short; `--no-bundle`
      # skips the installers, since the test runs the binary itself.
      - name: Build the Desktop app
        run: npm run tauri -- build --debug --no-bundle

      - name: Run Desktop end-to-end tests
        run: xvfb-run -a npm run test:e2e:desktop

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-desktop
          path: |
            playwright-report-desktop
            test-results
          retention-days: 14
