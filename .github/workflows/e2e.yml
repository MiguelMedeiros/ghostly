name: E2E

# Real browsers against the shipped build of the web app and the extension.
# Peers meet through a relay inside the test process, so nothing here depends
# on outside services except the tests tagged @network (the public Cashu test mint).
# Too slow to hold up every pull request: it runs before each release (release.yml
# calls it and ships nothing unless it passes), and by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Test a deployed web app instead of a fresh build (e.g. https://app.ghostly.tools). Web tests only."
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "What to test: the tag being released"
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: ${{ !inputs.web_url }}
        run: npm run test:e2e

      - name: Run end-to-end tests against ${{ inputs.web_url }}
        if: ${{ inputs.web_url }}
        env:
          E2E_WEB_URL: ${{ inputs.web_url }}
        run: npx playwright test -c e2e/playwright.config.ts --project=web

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
