name: CI

on:
  push:
    # dev: where features land (main holds what is released; see CONTRIBUTING.md).
    # claude/security-auto-*: the security routine's fixes; see security-autorelease.yml.
    branches: [main, master, dev, "claude/security-auto-**"]
  pull_request:
    branches: [main, master, dev]
    # ready_for_review: a draft may have skipped the Rust jobs (see `changes`); leaving draft runs everything.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Anything else (pushes to dev and main, which gate
# merges and the security autorelease) gets a group of its own: sharing one by ref would still cancel a queued
# run whenever a third arrives, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Which of the Rust jobs a draft pull request needs
  # ============================================
  # Drafts get pushed often and mostly touch TypeScript: they skip Tauri and CLI unless the pull request changed
  # something those jobs build. A skipped job still reports its check (as passing), and CI Success accepts it only
  # when this job said so. Pushes and ready pull requests always run everything. If the lookup fails, so does this
  # job, and CI Success with it: nothing is skipped by accident.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - name: Does a Rust job need to run
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          if [[ "$DRAFT" != "true" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "$FILES_URL" --jq '.[].filename')
          echo "$files"
          if grep -qE '^(src-tauri/|cli/|native-transports/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft without Rust changes: Tauri Backend and CLI skipped"
          fi

  # ============================================
  # Frontend (src, packages, extension) - React + Vite + TypeScript
  # ============================================
  frontend:
    name: Frontend (src)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      # Runs no test: reads e2e/features.json and what every test says it covers (docs/TESTING.md).
      - name: Test map (every feature has a test)
        run: npm run test:map

      - name: Protocol tests (packages/core)
        run: npm test

      - name: Build
        run: npm run build

      # Seconds, and it is the one thing no other job would notice: see
      # scripts/check-desktop-bundle.mjs. The real Desktop test is in e2e.yml.
      - name: Desktop build carries its Desktop wiring
        run: npm run check:desktop-bundle

      - name: Build browser extension
        run: npm run build:extension

      - name: Build web app
        run: npm run build:web

      # The adapter SDK, the way an outside author gets it: packed into a tarball, installed into
      # examples/sdk-adapter (not a workspace member), whose adapters must pass the contract suites.
      - name: SDK tarball and the example built on it
        run: npm run test:sdk-example

  # ============================================
  # Tauri Backend (src-tauri) - Rust
  # ============================================
  tauri:
    name: Tauri Backend (src-tauri)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tauri-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-${{ github.repository }}-

      # tauri-build wants every bundled resource to exist. `tauri build` fills this one
      # (scripts/prepare-native-runtime.mjs); plain cargo only needs the folder.
      - name: Native runtime folder
        run: mkdir -p src-tauri/native-runtime

      - name: Check formatting (src-tauri)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy (src-tauri)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build (src-tauri)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Test (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The Iroh framing, limits and reconnects, on loopback: seconds, and the
      # dependencies are already built for src-tauri.
      - name: Test (native-transports)
        run: cargo test --manifest-path native-transports/Cargo.toml

  # ============================================
  # CLI - Rust
  # ============================================
  cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cli-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-${{ github.repository }}-

      - name: Check formatting (cli)
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy (cli)
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Build (cli)
        run: cargo build --manifest-path cli/Cargo.toml

      - name: Test (cli)
        run: cargo test --manifest-path cli/Cargo.toml

  # ============================================
  # Website - Next.js
  # ============================================
  website:
    name: Website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ============================================
  # All checks passed
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs: [changes, frontend, tauri, cli, website]
    # Not always(): that also runs in a run cancelled by a newer push, where it would mark the superseded commit
    # failed. A failed job still gets here, and fails this one.
    if: ${{ !cancelled() }}
    steps:
      - name: Check all jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          FRONTEND: ${{ needs.frontend.result }}
          TAURI: ${{ needs.tauri.result }}
          CLI: ${{ needs.cli.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          # Skipped only counts when `changes` chose to skip the Rust jobs.
          rust_ok() { [[ "$1" == "success" || ( "$1" == "skipped" && "$RUST" == "false" ) ]]; }
          if [[ "$CHANGES" != "success" || "$FRONTEND" != "success" || "$WEBSITE" != "success" ]] || \
             ! rust_ok "$TAURI" || ! rust_ok "$CLI"; then
            echo "One or more jobs failed: changes=$CHANGES frontend=$FRONTEND tauri=$TAURI cli=$CLI website=$WEBSITE"
            exit 1
          fi
          echo "All jobs passed! (tauri=$TAURI cli=$CLI)"
