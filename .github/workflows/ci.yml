name: CI

on:
  push:
    # dev: where features land (main holds what is released; see CONTRIBUTING.md).
    # claude/security-auto-*: the security routine's fixes; see security-autorelease.yml.
    branches: [main, master, dev, "claude/security-auto-**"]
  pull_request:
    branches: [main, master, dev]
    # ready_for_review: a draft may have skipped the Rust jobs (see `changes`); leaving draft runs everything.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Anything else (pushes to dev and main, which gate
# merges and the security autorelease) gets a group of its own: sharing one by ref would still cancel a queued
# run whenever a third arrives, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Which of the path-gated jobs a pull request needs
  # ============================================
  # scripts/ci-changes.mjs decides, from the files the pull request changes (a renamed file counts by both names):
  # - Tauri and CLI: drafts get pushed often and mostly touch TypeScript, so a draft skips them unless it changed
  #   something they build. Leaving draft (ready_for_review) runs them again.
  # - Website: runs when the pull request changes something the site reads (website/, docs/, the files its
  #   scripts copy or quote; the list is tested against those scripts).
  # - The Desktop jobs on macOS: skipped only when every change is in website/ or docs/, which the app never reads.
  # A skipped job still reports its check, and CI Success accepts it only when this job said so. Pushes (dev, main)
  # run everything. If the lookup fails, so does this job, and CI Success with it: nothing is skipped by accident.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      website: ${{ steps.plan.outputs.website }}
      app: ${{ steps.plan.outputs.app }}
    steps:
      - name: Checkout the gate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-changes.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Which jobs this change needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            printf 'rust=true\nwebsite=true\napp=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "$FILES_URL" --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' > "$RUNNER_TEMP/files.tsv"
          # The files API lists at most 3000 files: a longer pull request runs everything.
          if (( $(wc -l < "$RUNNER_TEMP/files.tsv") < CHANGED )); then
            echo "::notice::More files changed than the files API lists: everything runs"
            printf 'rust=true\nwebsite=true\napp=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(tr '\t' '\n' < "$RUNNER_TEMP/files.tsv" | grep -v '^$')
          echo "$files"
          node scripts/ci-changes.mjs --draft="$DRAFT" <<< "$files"

  # ============================================
  # Frontend (src, packages, extension) - React + Vite + TypeScript
  # ============================================
  # Four jobs side by side instead of one in a row (6 minutes): lint and types, the unit tests in two halves, and
  # the builds. They run on every pull request: the tests read files from all over the repository, website/ too.
  frontend-checks:
    name: Frontend lint and types
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      # Runs no test: reads e2e/features.json and what every test says it covers (docs/TESTING.md).
      - name: Test map (every feature has a test)
        run: npm run test:map

  frontend-tests:
    name: Frontend tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # `npm test` is test:packages then test:app; each runs here on its own runner.
        suite: [packages, app]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # A test added to `npm test` beside the two halves would run nowhere here.
      - name: The two halves are all of npm test
        run: |
          test="$(node -p 'require("./package.json").scripts.test')"
          if [[ "$test" != "npm run test:packages && npm run test:app" ]]; then
            echo "::error::package.json's test script is now \"$test\": run each part in a matrix entry of ci.yml's frontend-tests"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (npm run test:${{ matrix.suite }})
        run: npm run test:${{ matrix.suite }}

  frontend-build:
    name: Frontend builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Seconds, and it is the one thing no other job would notice: see
      # scripts/check-desktop-bundle.mjs. The real Desktop test is in e2e.yml.
      - name: Desktop build carries its Desktop wiring
        run: npm run check:desktop-bundle

      - name: Build browser extension
        run: npm run build:extension

      - name: Build web app
        run: npm run build:web

      # The adapter SDK, the way an outside author gets it: packed into a tarball, installed into
      # examples/sdk-adapter (not a workspace member), whose adapters must pass the contract suites.
      - name: SDK tarball and the example built on it
        run: npm run test:sdk-example

  # ============================================
  # Tauri Backend (src-tauri) - Rust
  # ============================================
  tauri:
    name: Tauri Backend (src-tauri)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tauri-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-${{ github.repository }}-

      # tauri-build wants every bundled resource to exist. `tauri build` fills this one
      # (scripts/prepare-native-runtime.mjs); plain cargo only needs the folder.
      - name: Native runtime folder
        run: mkdir -p src-tauri/native-runtime

      - name: Check formatting (src-tauri)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy (src-tauri)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build (src-tauri)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Test (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The Iroh framing, limits and reconnects, on loopback: seconds, and the
      # dependencies are already built for src-tauri.
      - name: Test (native-transports)
        run: cargo test --manifest-path native-transports/Cargo.toml

  # ============================================
  # CLI - Rust
  # ============================================
  cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cli-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-${{ github.repository }}-

      - name: Check formatting (cli)
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy (cli)
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Build (cli)
        run: cargo build --manifest-path cli/Cargo.toml

      - name: Test (cli)
        run: cargo test --manifest-path cli/Cargo.toml

  # ============================================
  # Website - Next.js
  # ============================================
  # Only when the pull request changes something the site reads (see `changes`). The checks here, the browser
  # checks in website-e2e.
  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The home's wallet deck is the app's own code, copied (scripts/sync-app-deck.mjs).
      - name: App deck copies match the app
        run: node scripts/sync-app-deck.mjs --check

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  # The site's browser checks, in four shards of about the same time (website/e2e/shard.mjs), each on its own build:
  # building takes less than passing one build around. One runner ran them all in about 11 minutes.
  website-e2e:
    name: Website browser checks (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The 4 below and in the name must match this list.
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium and its system libraries download while the site builds.
      - name: Build, and install Chromium meanwhile
        run: |
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1 &
          chromium=$!
          npm run build
          status=0
          wait "$chromium" || status=$?
          tail -n 20 "$RUNNER_TEMP/chromium.log"
          exit "$status"

      - name: Browser checks (shard ${{ matrix.shard }} of 4)
        run: node e2e/shard.mjs ${{ matrix.shard }} 4

  # ============================================
  # Desktop on a Mac plays voice messages (system WKWebView, the shipped CSP)
  # ============================================
  # WKWebView has no WebDriver, so the Desktop e2e (Linux) never sees the engine most Desktop users run: this
  # plays every committed recording (e2e/support/voice-fixtures/) in it, under tauri.conf.json's policy.
  # Needs only Node and swiftc. The CSP once had no media-src and every voice message failed here alone.
  desktop-media:
    name: Desktop media (macOS WKWebView)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Voice recordings play in WKWebView under Desktop's CSP
        run: node scripts/voice-media/check-wkwebview.mjs

  # ============================================
  # Two Desktop apps on a Mac call and share an app (system WKWebView, the test driver)
  # ============================================
  # A call's media is WebRTC, which WebKitGTK lacks: a Linux Desktop pair goes live on Iroh or HyperDHT but cannot call.
  # desktop-macos.yml builds the app with the test driver and runs e2e/desktop-macos/ (about 4 minutes).
  desktop-macos:
    name: Desktop on macOS
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/desktop-macos.yml

  # ============================================
  # All checks passed
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs: [changes, frontend-checks, frontend-tests, frontend-build, tauri, cli, website, website-e2e, desktop-media, desktop-macos]
    # Not always(): that also runs in a run cancelled by a newer push, where it would mark the superseded commit
    # failed. A failed job still gets here, and fails this one.
    if: ${{ !cancelled() }}
    steps:
      - name: Check all jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          WEBSITE_GATE: ${{ needs.changes.outputs.website }}
          APP: ${{ needs.changes.outputs.app }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          TAURI: ${{ needs.tauri.result }}
          CLI: ${{ needs.cli.result }}
          WEBSITE: ${{ needs.website.result }}
          WEBSITE_E2E: ${{ needs.website-e2e.result }}
          DESKTOP_MEDIA: ${{ needs.desktop-media.result }}
          DESKTOP_MACOS: ${{ needs.desktop-macos.result }}
        run: |
          # Skipped only counts when `changes` chose to skip that job.
          ok() { [[ "$1" == "success" || ( "$1" == "skipped" && "$2" == "false" ) ]]; }
          summary="changes=$CHANGES frontend-checks=$FRONTEND_CHECKS frontend-tests=$FRONTEND_TESTS frontend-build=$FRONTEND_BUILD tauri=$TAURI cli=$CLI website=$WEBSITE website-e2e=$WEBSITE_E2E desktop-media=$DESKTOP_MEDIA desktop-macos=$DESKTOP_MACOS"
          if [[ "$CHANGES" != "success" || "$FRONTEND_CHECKS" != "success" || "$FRONTEND_TESTS" != "success" || "$FRONTEND_BUILD" != "success" ]] || \
             ! ok "$TAURI" "$RUST" || ! ok "$CLI" "$RUST" || \
             ! ok "$WEBSITE" "$WEBSITE_GATE" || ! ok "$WEBSITE_E2E" "$WEBSITE_GATE" || \
             ! ok "$DESKTOP_MEDIA" "$APP" || ! ok "$DESKTOP_MACOS" "$APP"; then
            echo "One or more jobs failed: $summary"
            exit 1
          fi
          echo "All jobs passed! ($summary)"
