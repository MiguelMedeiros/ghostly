name: CI

on:
  push:
    # dev: where features land (main holds what is released; see .github/CONTRIBUTING.md).
    # claude/security-auto-*: the security routine's fixes; see security-autorelease.yml.
    branches: [main, master, dev, "claude/security-auto-**"]
  pull_request:
    branches: [main, master, dev]
    # ready_for_review: a draft runs the fast tier only (see `changes`); leaving draft runs everything.
    # Whether the pull request is a draft is read from the API when `changes` runs, never from the event: a push and
    # `gh pr ready` a second apart start two runs, the later one cancels the other, and the survivor may be the push's
    # run, whose payload still says draft (#742, #737, #759).
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue on dev tests what dev would become (dev plus the pull requests ahead in the queue) on a temporary
  # gh-readonly-queue/dev/... branch, and merges only when CI Success passes there. Inert until the dev ruleset has a
  # merge_queue rule.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A merge queue entry groups by its ref
# (gh-readonly-queue/dev/pr-<n>-<base sha>), which no other entry shares, so entries never cancel each other: a queue
# that drops an entry builds the ones behind it again on new refs. Anything else (pushes to dev and main, which gate
# merges and the security autorelease) gets a group of its own: sharing one by ref would still cancel a queued run
# whenever a third arrives, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Which of the path-gated jobs a pull request needs
  # ============================================
  # tools/scripts/ci-changes.mjs decides, from the files the pull request changes (a renamed file counts by both names)
  # and whether it is a draft:
  # - A draft gets the fast tier: lint and types, the unit tests the change can reach (affected-tests), the site's
  #   checks when the site changed, and Tauri when Rust changed. The app's tests, the packages shards, the CLI on ARM64,
  #   the builds, the site's browser checks and the macOS jobs wait for ready_for_review, whose run plans everything.
  #   Many sessions push drafts at once, and the free plan runs about 20 jobs at a time (5 on macOS).
  # - Website: runs when the pull request changes something the site reads (apps/website/, docs/, the files its
  #   scripts copy or quote; the list is tested against those scripts).
  # - The Desktop jobs on macOS: skipped only when every change is in apps/website/ or docs/, which the app never reads.
  # - The packages' unit tests: skipped when every change is in docs/ or in apps/website/ outside the few site files their
  #   tests read (the list is tested against what they name).
  # A skipped job still reports its check, and the gate job (CI Success) accepts it only when this job said so. Pushes
  # (dev, main) run everything. If the lookup fails, so does this job, and CI Success with it: nothing is skipped by
  # accident.
  # A merge queue entry plans from everything it would put on dev (its base against its head: every queued pull
  # request up to it) and is never a draft. If that diff cannot be read it runs everything instead of failing, which
  # would drop it and every pull request behind it from the queue.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      website: ${{ steps.plan.outputs.website }}
      website_e2e: ${{ steps.plan.outputs.website_e2e }}
      app: ${{ steps.plan.outputs.app }}
      packages: ${{ steps.plan.outputs.packages }}
      full: ${{ steps.plan.outputs.full }}
      affected: ${{ steps.plan.outputs.affected }}
      draft: ${{ steps.plan.outputs.draft }}
    steps:
      - name: Checkout the gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/scripts/ci-changes.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Which jobs this change needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PAYLOAD_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ "$EVENT" == "merge_group" ]]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            # The checkout holds the head (depth 1); the base is one more commit, trees only needed. --no-renames
            # lists a renamed file by both names, as the pull request path does.
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
               files=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA") && [[ -n "$files" ]]; then
              echo "$files"
              node tools/scripts/ci-changes.mjs --draft=false <<< "$files"
            else
              echo "::notice::Could not list what the merge group changes against $BASE_SHA: everything runs"
              node tools/scripts/ci-changes.mjs --draft=false --all
            fi
            exit 0
          fi
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            node tools/scripts/ci-changes.mjs --draft=false --all
            exit 0
          fi
          # The draft state now, not the event's: see `on.pull_request` above.
          draft=$(gh api "$PR_URL" --jq .draft)
          [[ "$draft" == "true" || "$draft" == "false" ]] || { echo "::error::Could not read the draft state: $draft"; exit 1; }
          echo "Draft: $draft (the event said $PAYLOAD_DRAFT)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          # A pull request that changes no file (main merged back into dev after a release) gives nothing to plan
          # from: every path gate is on (a draft still gets the fast tier).
          if (( CHANGED == 0 )); then
            echo "::notice::This pull request changes no file: every path gate is on"
            node tools/scripts/ci-changes.mjs --draft="$draft" --all
            exit 0
          fi
          gh api --paginate "$FILES_URL" --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' > "$RUNNER_TEMP/files.tsv"
          # The files API lists at most 3000 files: a longer pull request runs everything.
          if (( $(wc -l < "$RUNNER_TEMP/files.tsv") < CHANGED )); then
            echo "::notice::More files changed than the files API lists: every path gate is on"
            node tools/scripts/ci-changes.mjs --draft="$draft" --all
            exit 0
          fi
          files=$(tr '\t' '\n' < "$RUNNER_TEMP/files.tsv" | grep -v '^$')
          echo "$files"
          node tools/scripts/ci-changes.mjs --draft="$draft" <<< "$files"

  # ============================================
  # Frontend (src, packages, extension) - React + Vite + TypeScript
  # ============================================
  # Jobs side by side instead of one in a row (6 minutes): lint and types, the app's unit tests, the packages' unit
  # tests in shards, and the builds. Lint and types run on every pull request, drafts included; the others on every
  # ready one (the app's tests read files from all over the repository, apps/website/ too). A draft runs
  # affected-tests instead.
  frontend-checks:
    name: Frontend lint and types
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Side by side: each is one process at a time (eslint, then tsc after tsc), the runner has 4 cores, and in a row they
      # took 71 + 144 s. Each one's output is printed whole once both are done, so the annotations still come from it.
      - name: ESLint and TypeScript check
        run: |
          npm run lint > "$RUNNER_TEMP/lint.log" 2>&1 &
          lint=$!
          npm run typecheck > "$RUNNER_TEMP/types.log" 2>&1 &
          types=$!
          lint_result=passed
          wait "$lint" || lint_result=failed
          types_result=passed
          wait "$types" || types_result=failed
          echo "::group::ESLint ($lint_result)"; cat "$RUNNER_TEMP/lint.log"; echo "::endgroup::"
          echo "::group::TypeScript check ($types_result)"; cat "$RUNNER_TEMP/types.log"; echo "::endgroup::"
          [[ $lint_result == passed ]] || echo "::error::ESLint failed (npm run lint): see its group above"
          [[ $types_result == passed ]] || echo "::error::The TypeScript check failed (npm run typecheck): see its group above"
          [[ $lint_result == passed && $types_result == passed ]]

      # docs/changelog/unreleased/<slug>.md: one file per changelog entry, put into CHANGELOG.md at release
      # (tools/scripts/changes.mjs).
      - name: Changelog entries are well formed
        run: node tools/scripts/changes.mjs

      # Runs no test: reads e2e/features.json and what every test says it covers (docs/TESTING.md). The map goes to
      # the run's summary page: it is not committed.
      - name: Test map (every feature has a test)
        run: npm run test:map -- --summary

  frontend-tests:
    name: Frontend tests (app)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # `npm test` is test:packages (the shards below) then test:app (here). A test added beside the two would run
      # nowhere; tools/scripts/test-shards.mjs checks test:packages is a list of workspaces it knows how to split.
      - name: The two halves are all of npm test
        run: |
          test="$(node -p 'require("./package.json").scripts.test')"
          if [[ "$test" != "npm run test:packages && npm run test:app" ]]; then
            echo "::error::package.json's test script is now \"$test\": run each part in ci.yml (frontend-tests, packages-tests)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (npm run test:app)
        run: npm run test:app

  # The packages' unit tests (npm run test:packages) in four shards of about the same time, each on its own runner
  # (tools/scripts/test-shards.mjs, by tools/scripts/test-durations.json). One runner took them in 6.5 minutes, package after
  # package. The CLI's two-peer story (about 3 minutes of designed waits, one test after another) has a shard to
  # itself and sets the pace.
  packages-tests:
    name: Frontend tests (packages ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    # A daemon that never exits would otherwise hold the runner for 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The 4 below and in the name must match this list.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (shard ${{ matrix.shard }} of 4)
        run: node tools/scripts/test-shards.mjs ${{ matrix.shard }} 4 --report-dir "$RUNNER_TEMP/test-reports"

      # Each file's time, for `node tools/scripts/test-shards.mjs --record` after a test file gets slower.
      - name: Keep the test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-test-reports-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-reports
          retention-days: 14
          if-no-files-found: ignore

  # A draft's unit tests: only the ones its change can reach (tools/scripts/test-affected.mjs, what sessions run before
  # they push), on one runner instead of the five above. `vitest related` per project; a project's config, setup or the
  # lock file runs that project whole. Lint and types are frontend-checks' (whole), Rust is tauri's, the e2e is no
  # pull request's. Leaving draft runs the full suites above instead.
  affected-tests:
    name: Affected unit tests (draft)
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The pull request's merge commit and its first parent, the base it is merged onto: their difference is the change.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests the change reaches
        env:
          JOBS: "4"
        run: node tools/scripts/test-affected.mjs --base HEAD^1 --no-e2e --no-rust --no-lint --no-typecheck

  # ============================================
  # The headless CLI on Linux ARM64 (Graviton, Ampere, Hetzner ARM, a Raspberry Pi)
  # ============================================
  # The shards above run on x64 only. Here: the CLI packed as npm publishes it, installed into an empty folder the way
  # `npm install -g @ghostlytools/cli` does (its dependencies from npm, so node-datachannel's linux-arm64 build comes
  # from its own optional package), must start a daemon with WebRTC and calls on. Then the CLI's whole test suite, the
  # two-peer story included: pairing, messages, files and a voice call over libdatachannel, on arm64.
  # No Rust: the Iroh WebAssembly the CLI bundles is committed (packages/iroh-web/pkg).
  cli-linux-arm64:
    name: CLI on Linux ARM64
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04-arm
    # A daemon that never exits would otherwise hold the runner for 6 hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI
        run: npm run build -w @ghostlytools/cli

      # What `npm publish` would upload, installed with nothing of this checkout around it. `--prefer-offline`: the
      # npm ci above filled the cache with most of what it needs.
      - name: Pack and install the package
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/$(npm pack -w @ghostlytools/cli --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)"
          ls -l "$tarball"
          mkdir "$RUNNER_TEMP/installed"
          cd "$RUNNER_TEMP/installed"
          npm init -y > /dev/null
          npm install --prefer-offline --no-audit --no-fund "$tarball"
          ls node_modules/@node-datachannel/

      # The packed CLI on its own, with no Pkarr relay, Mainline DHT or HyperDHT to reach: it starts a daemon, and that daemon
      # has WebRTC and calls, which need node-datachannel's native module and opusscript to load on arm64.
      - name: The installed CLI runs a daemon with WebRTC and calls
        working-directory: ${{ runner.temp }}/installed
        env:
          GHOSTLY_HOME: ${{ runner.temp }}/ghostly-home
          GHOSTLY_DHT: "0"
          GHOSTLY_HYPERDHT_BOOTSTRAP: 127.0.0.1:9
        run: |
          set -euo pipefail
          ghostly=node_modules/.bin/ghostly
          $ghostly --version
          $ghostly settings set relays '["http://127.0.0.1:9"]'
          trap '$ghostly daemon stop || true' EXIT
          $ghostly daemon --detach
          $ghostly status | tee status.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("status.json", "utf8").trim().split("\n").pop());
            if (s.webrtc !== true || s.calls !== true) { console.error("::error::the installed CLI has webrtc=" + s.webrtc + " calls=" + s.calls); process.exit(1); }
          '
          $ghostly daemon stop
          trap - EXIT

      # The CLI's own suite, as the packages shards run it on x64 (its Vitest builds dist/ again first). Skipped here as
      # on x64: fedimint (a regtest federation) and payments (a test mint), which need the Docker e2e services, the long
      # chat bench, and the ffmpeg comparisons in voicePeaks when ffmpeg is missing.
      - name: jq for the Claude Code agent example
        run: command -v jq || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: CLI tests
        run: npm run test -w @ghostlytools/cli

  frontend-build:
    name: Frontend builds
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Seconds, and it is the one thing no other job would notice: see
      # tools/scripts/check-desktop-bundle.mjs. The real Desktop test is in e2e.yml.
      - name: Desktop build carries its Desktop wiring
        run: npm run check:desktop-bundle

      - name: Build browser extension
        run: npm run build:extension

      - name: Build web app
        run: npm run build:web

      # The adapter SDK, the way an outside author gets it: packed into a tarball, installed into
      # packages/sdk/examples/adapter (not a workspace member), whose adapters must pass the contract suites.
      - name: SDK tarball and the example built on it
        run: npm run test:sdk-example

  # ============================================
  # Tauri Backend (apps/desktop) - Rust
  # ============================================
  tauri:
    name: Tauri Backend (apps/desktop)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      # Line numbers in a panic's backtrace are all these tests need of debug info: the cache below is half the size
      # and restores in half the time (it was 3 GB and up to 105 s).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev librsvg2-dev patchelf libssl-dev
        libgtk-3-dev libayatana-appindicator3-dev
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The .deb files apt fetched for these packages on this runner image. apt-get update and the download from the
      # mirror outlasted the Cargo restore by 19 s at the median, but by 4 to 20 minutes on one dev run in five, and
      # set the job's time; from the cache the packages install with no network, inside the Cargo restore. One entry
      # per runner image (a new image has other versions already installed, so it needs another set) and package
      # list, about 80 MB. Unlike the Cargo cache, any run saves it on a miss: that happens once per weekly image.
      - name: Apt cache key
        id: apt-key
        run: echo "key=${ImageOS}-${ImageVersion}-apt-tauri-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      # In the background, while the cache below downloads; "Wait for the system dependencies" joins it.
      # Both paths install the same way, from the .deb files, so a cached run and a fresh one test the same thing.
      - name: Install system dependencies
        env:
          CACHED: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          {
            debs="$RUNNER_TEMP/apt-debs"
            # needrestart's scan, the man-db index and dpkg's fsyncs add time and nothing to a runner thrown away after.
            apt_get() { sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get -y "$@"; }
            sudo rm -f /var/lib/man-db/auto-update
            echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/99-unsafe-io > /dev/null
            echo "$(date +%T) remove libunwind-14-dev"
            # GStreamer's headers (calls on Linux, apps/desktop/src/native_call) need libunwind-dev, which the
            # runner image's libunwind-14-dev (LLVM's) blocks.
            apt_get remove libunwind-14-dev || true
            if [[ "$CACHED" != "true" ]]; then
              echo "$(date +%T) update"
              apt_get update
              echo "$(date +%T) download"
              mkdir -p "$debs/partial"
              # shellcheck disable=SC2086
              apt_get install --download-only -o Dir::Cache::Archives="$debs" $APT_PACKAGES
              sudo rm -rf "$debs/partial" "$debs/lock"
            fi
            echo "$(date +%T) install $(ls "$debs" | wc -l) packages, $(du -sh "$debs" | cut -f1)"
            # A cached set can miss a package a newer runner image now needs, and the image's own index can name a
            # version the mirror no longer serves (404). Then fetch the set again from a fresh index.
            if ! apt_get install "$debs"/*.deb; then
              echo "$(date +%T) install from the cached set failed: update and download again"
              apt_get update
              mkdir -p "$debs/partial"
              # shellcheck disable=SC2086
              apt_get install --download-only -o Dir::Cache::Archives="$debs" $APT_PACKAGES
              sudo rm -rf "$debs/partial" "$debs/lock"
              apt_get install "$debs"/*.deb
            fi
            echo "$(date +%T) done"
          } > "$RUNNER_TEMP/apt.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apt.pid"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      # Crates and what they compiled to. The repository's cache is full (10 GB), so only a push to dev saves one,
      # once per Cargo.lock and toolchain, with only what that build used (see the step before Save Cargo); a pull
      # request restores dev's.
      - name: Restore Cargo
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # "used": saved by the step before Save Cargo. The first push to dev under this name starts from the last
          # "lines" cache and saves a trimmed one; the second restore key can go once that is done.
          key: ${{ runner.os }}-cargo-tauri-used-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-used-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-tauri-lines-${{ steps.rust.outputs.cachekey }}-

      # Every file cargo reads from here on is newer than this (atime; the runner's disk is mounted relatime).
      - name: Mark the Cargo restore
        run: touch "$RUNNER_TEMP/cargo-restored"

      - name: Wait for the system dependencies
        run: |
          pid=$(cat "$RUNNER_TEMP/apt.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2} ' "$RUNNER_TEMP/apt.log" || true
          tail -n 5 "$RUNNER_TEMP/apt.log"
          # The exit status of a process that is not this shell's child is gone: check the result instead.
          # shellcheck disable=SC2086
          dpkg -s $APT_PACKAGES > /dev/null

      - name: Save the system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      # tauri-build wants every bundled resource to exist. `tauri build` fills this one
      # (tools/scripts/prepare-native-runtime.mjs); plain cargo only needs the folder.
      - name: Native runtime folder
        run: mkdir -p apps/desktop/native-runtime

      - name: Check formatting (apps/desktop)
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check

      - name: Clippy (apps/desktop)
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml -- -D warnings

      - name: Build (apps/desktop)
        run: cargo build --manifest-path apps/desktop/Cargo.toml

      - name: Test (apps/desktop)
        id: test
        run: cargo test --manifest-path apps/desktop/Cargo.toml

      # The Iroh framing, limits and reconnects, on loopback: seconds, and the
      # dependencies are already built for apps/desktop.
      - name: Test (native/transports)
        run: cargo test --manifest-path native/transports/Cargo.toml

      # A new Cargo.lock restores the previous one's cache and builds what changed next to it, so without this every
      # dependency update stayed in: 13 GB of target/ (3.2 GB packed, about 60 s to restore), 16 builds of some
      # crates, 6 GB of files no build had read since. Kept: the units of this build's graph, whose fingerprints
      # cargo read (fresh) or wrote (built) in this job. Their files in deps/ and build/ carry the same hash.
      # Left out as well: Ghostly's own crates and their examples, built again on every change anyway.
      - name: Keep only what this build used in the saved Cargo cache
        id: prune
        if: ${{ !cancelled() && steps.test.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        working-directory: target/debug
        run: |
          echo "before: $(du -sh . | cut -f1)"
          rm -rf incremental examples
          find . deps .fingerprint build -maxdepth 1 -name '*ghostly*' -exec rm -rf {} +
          marker="$RUNNER_TEMP/cargo-restored"
          find .fingerprint -mindepth 2 -type f \( -anewer "$marker" -o -newer "$marker" \) |
            sed -E 's|^\.fingerprint/.*-([0-9a-f]{16})/.*$|\1|' | sort -u > "$RUNNER_TEMP/cargo-live"
          printf '%s\n' .fingerprint/* build/* deps/* | grep -E -- '-[0-9a-f]{16}(\.[a-z]+)?$' |
            sed -E 's/^.*-([0-9a-f]{16})(\.[a-z]+)?$/\1 &/' > "$RUNNER_TEMP/cargo-all"
          used=$(wc -l < "$RUNNER_TEMP/cargo-live")
          units=$(cut -d' ' -f1 "$RUNNER_TEMP/cargo-all" | sort -u | wc -l)
          echo "units: $units, used by this build: $used"
          # Were the reads not seen (a disk mounted noatime), this would empty the cache: keep everything instead.
          if (( used < 200 )); then
            echo "::warning::Only $used units read since the restore: the Cargo cache is saved as it is"
          else
            awk 'NR == FNR { used[$1]; next } !($1 in used) { print $2 }' "$RUNNER_TEMP/cargo-live" "$RUNNER_TEMP/cargo-all" | xargs -r rm -rf
          fi
          echo "after: $(du -sh . | cut -f1)"

      - name: Save Cargo
        if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # ============================================
  # Website - Next.js
  # ============================================
  # Only when the pull request changes something the site reads (see `changes`). The checks here (drafts too), the
  # browser checks in website-e2e (not in a draft).
  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The route index and the other lib/*.json the site imports are generated from docs/wisps and not committed
      # (a PR never touches them, so they never conflict). The build makes them itself (prebuild); lint, types and
      # the tests below need them first.
      - name: Generate the reference files
        run: npm run sync:references

      # The index table in docs/wisps/README.md is written by the sync above from the WISPs' headers
      # (scripts/wisp-index.mjs) and committed, so GitHub shows it: the sync must leave it as it was.
      - name: The WISP index is up to date
        run: git diff --exit-code -- ../../docs/wisps/README.md || { echo "::error file=docs/wisps/README.md::The WISP index is out of date. Run npm run sync:references in apps/website/ and commit docs/wisps/README.md."; exit 1; }

      # The home's wallet deck is the app's own code, copied (scripts/sync-app-deck.mjs).
      - name: App deck copies match the app
        run: node scripts/sync-app-deck.mjs --check

      - name: ESLint
        run: npm run lint

      # WISP content lives in docs/wisps only: every WISP has the header rows the site reads, and the site
      # holds no text of its own per WISP (scripts/check-single-source.mjs).
      - name: WISP content has one source
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

  # The site's browser checks, in four shards of about the same time (apps/website/e2e/shard.mjs), each on its own build:
  # building (about 25 s) takes less than passing one build around. One runner ran them all in about 11 minutes.
  website-e2e:
    name: Website browser checks (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.website_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The 4 below and in the name must match this list.
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The headless shell the checks run in, one copy per Playwright version.
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ steps.playwright.outputs.version }}

      # Chromium installs while the site builds. It used to be `install --with-deps`, whose apt-get took 4 to 9
      # minutes on about one shard job in ten (normally 30 s) and so set the whole CI cycle. The runner image
      # already has the libraries Chromium loads (Google Chrome is on it); apt runs only when ldd finds one missing.
      # All --with-deps would add is fonts (CJK, Thai, unifont, X11 bitmaps; the image has Liberation and Noto Color
      # Emoji), and the site's fonts are its own (next/font).
      - name: Build, and install Chromium meanwhile
        run: |
          {
            echo "$(date +%T) download"
            npx playwright install --only-shell chromium
            echo "$(date +%T) downloaded"
            shell=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | tail -n 1)
            if [ ! -x "$shell" ] || ldd "$shell" | grep "not found"; then
              echo "$(date +%T) libraries missing, apt-get"
              npx playwright install-deps chromium
            fi
            echo "$(date +%T) done"
          } > "$RUNNER_TEMP/chromium.log" 2>&1 &
          chromium=$!
          echo "$(date +%T) build"
          npm run build
          echo "$(date +%T) built"
          status=0
          wait "$chromium" || status=$?
          grep -v "■\|% of " "$RUNNER_TEMP/chromium.log"
          exit "$status"

      - name: Browser checks (shard ${{ matrix.shard }} of 4)
        run: node e2e/shard.mjs ${{ matrix.shard }} 4

  # ============================================
  # Desktop on a Mac plays voice messages (system WKWebView, the shipped CSP)
  # ============================================
  # WKWebView has no WebDriver, so the Desktop e2e (Linux) never sees the engine most Desktop users run: this
  # plays every committed recording (e2e/support/voice-fixtures/) in it, under tauri.conf.json's policy.
  # Needs only Node and swiftc. The CSP once had no media-src and every voice message failed here alone.
  desktop-media:
    name: Desktop media (macOS WKWebView)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Voice recordings play in WKWebView under Desktop's CSP
        run: node tools/scripts/voice-media/check-wkwebview.mjs

  # ============================================
  # Two Desktop apps on a Mac call and share an app (system WKWebView, the test driver)
  # ============================================
  # A call's media is WebRTC, which WebKitGTK lacks: a Linux Desktop pair goes live on Iroh or HyperDHT but cannot call.
  # desktop-macos.yml builds the app with the test driver and runs e2e/desktop-macos/ (about 4 minutes).
  desktop-macos:
    name: Desktop on macOS
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/desktop-macos.yml

  # ============================================
  # All checks passed
  # ============================================
  # On a draft this job is named "CI Success (draft)", so a draft run never reports the check the dev ruleset requires.
  # A green "CI Success" from a draft run let `gh pr ready` + `gh pr merge --auto` merge at once, before the full run
  # that leaving draft starts had made its own (#590, 2026-09-29). And a skipped job would not do: GitHub counts a
  # skipped required check as passed. `changes` read the draft state from the API when it planned this run, so the
  # name and the plan agree: "CI Success" only ever comes from a run that planned the full tier.
  ci-success:
    name: ${{ needs.changes.outputs.draft == 'true' && 'CI Success (draft)' || 'CI Success' }}
    runs-on: ubuntu-24.04
    needs: [changes, frontend-checks, frontend-tests, packages-tests, affected-tests, cli-linux-arm64, frontend-build, tauri, website, website-e2e, desktop-media, desktop-macos]
    # Not always(): that also runs in a run cancelled by a newer push, where it would mark the superseded commit
    # failed. A failed job still gets here, and fails this one.
    if: ${{ !cancelled() }}
    steps:
      - name: Check all jobs passed
        env:
          DRAFT: ${{ needs.changes.outputs.draft }}
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          AFFECTED_GATE: ${{ needs.changes.outputs.affected }}
          RUST: ${{ needs.changes.outputs.rust }}
          WEBSITE_GATE: ${{ needs.changes.outputs.website }}
          WEBSITE_E2E_GATE: ${{ needs.changes.outputs.website_e2e }}
          APP: ${{ needs.changes.outputs.app }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          PACKAGES_TESTS: ${{ needs.packages-tests.result }}
          AFFECTED: ${{ needs.affected-tests.result }}
          CLI_ARM64: ${{ needs.cli-linux-arm64.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          TAURI: ${{ needs.tauri.result }}
          WEBSITE: ${{ needs.website.result }}
          WEBSITE_E2E: ${{ needs.website-e2e.result }}
          DESKTOP_MEDIA: ${{ needs.desktop-media.result }}
          DESKTOP_MACOS: ${{ needs.desktop-macos.result }}
        run: |
          # Not a draft (this job is "CI Success"): the plan must be the full tier, or nothing passes.
          if [[ "$DRAFT" != "true" && ( "$FULL" != "true" || "$AFFECTED_GATE" != "false" ) ]]; then
            echo "::error::A run planned with draft=$DRAFT full=$FULL affected=$AFFECTED_GATE cannot pass CI Success"
            exit 1
          fi
          # Skipped only counts when `changes` chose to skip that job.
          ok() { [[ "$1" == "success" || ( "$1" == "skipped" && "$2" == "false" ) ]]; }
          summary="draft=$DRAFT changes=$CHANGES frontend-checks=$FRONTEND_CHECKS frontend-tests=$FRONTEND_TESTS packages-tests=$PACKAGES_TESTS affected-tests=$AFFECTED cli-linux-arm64=$CLI_ARM64 frontend-build=$FRONTEND_BUILD tauri=$TAURI website=$WEBSITE website-e2e=$WEBSITE_E2E desktop-media=$DESKTOP_MEDIA desktop-macos=$DESKTOP_MACOS"
          if [[ "$CHANGES" != "success" || "$FRONTEND_CHECKS" != "success" ]] || \
             ! ok "$FRONTEND_TESTS" "$FULL" || ! ok "$FRONTEND_BUILD" "$FULL" || ! ok "$AFFECTED" "$AFFECTED_GATE" || \
             ! ok "$PACKAGES_TESTS" "$PACKAGES" || ! ok "$CLI_ARM64" "$PACKAGES" || ! ok "$TAURI" "$RUST" || \
             ! ok "$WEBSITE" "$WEBSITE_GATE" || ! ok "$WEBSITE_E2E" "$WEBSITE_E2E_GATE" || \
             ! ok "$DESKTOP_MEDIA" "$APP" || ! ok "$DESKTOP_MACOS" "$APP"; then
            echo "One or more jobs failed: $summary"
            exit 1
          fi
          if [[ "$DRAFT" == "true" ]]; then
            echo "::notice::Draft: the fast tier passed. The required CI Success comes from the full run that leaving draft (gh pr ready) starts."
          fi
          echo "All jobs passed! ($summary)"
