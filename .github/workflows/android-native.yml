name: Android native

# The native Android app: apps/desktop built with Tauri 2 mobile (apps/desktop/gen/android, docs/ANDROID.md, "Native
# app"). Debug APKs only, signed with the Android debug key: to try the app and never to publish. The TWA lane
# (android.yml) stays as it is until the native app replaces it.
# - apk: arm64-v8a (phones, and an arm64 emulator on a Mac) and x86_64 (the emulator here), one artifact each.
# - emulator: the x86_64 APK on an Android emulator (KVM): it launches, the UI renders, the engine starts, and the
#   probe measures what the native app depends on (tools/scripts/android-smoke.mjs). Results are an artifact.
# On pull requests that touch the Desktop crate or this lane, and by hand.
on:
  pull_request:
    # ready_for_review: a draft skips this (see the draft job below); leaving draft builds it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/desktop/**"
      - "native/transports/**"
      - "Cargo.lock"
      - "tools/scripts/android-smoke.mjs"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The NDK Tauri builds with: the runner image's default one, named so a new image cannot change it quietly.
  NDK_VERSION: 27.3.13750724
  # A smaller debug library (a few hundred MB less in the APK) with backtraces that still name lines.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # A draft gets CI's fast tier only (ci.yml, `changes`): this builds once the pull request leaves draft
  # (ready_for_review) and on every push after. The draft state is read from the API, not the event: a push and
  # `gh pr ready` a second apart start two runs, the later cancels the other, and the survivor may be the push's,
  # whose event still says draft (#742). If the read fails, the build runs.
  draft:
    name: Draft pull request?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.read.outputs.draft }}
    steps:
      - name: Read the draft state
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          draft=$(gh api "$PR_URL" --jq .draft) || draft=unknown
          echo "Draft: $draft"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  apk:
    name: Debug APKs (arm64-v8a, x86_64)
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # The Android Gradle Plugin of Tauri's generated project runs on JDK 17.
      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # The SDK platform and build tools the generated project asks for (compileSdk 37) are fetched by Gradle itself
      # once the licences are accepted.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Android debug key the Gradle plugin makes on first use, kept from run to run, so a newer debug APK installs
      # over an older one (Android refuses an update signed with another key). It signs debug builds only, never a
      # release. A run with no cache makes a new one (the first run on a branch, or after 7 days unused): then the
      # older debug APK has to be uninstalled once.
      - name: Debug key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # `--split-per-abi`: one APK per ABI, each with only its own library. The web build runs first
      # (tauri.android.conf.json's beforeBuildCommand).
      - name: Build
        run: npm run tauri -- android build --debug --apk --split-per-abi --target aarch64 --target x86_64

      - name: Name the APKs
        run: |
          out=apps/desktop/gen/android/app/build/outputs/apk
          find "$out" -name '*.apk' -print
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$(find "$out" -path '*arm64*' -name '*.apk' | head -n1)" "$RUNNER_TEMP/apk/ghostly-debug-arm64-v8a.apk"
          cp "$(find "$out" -path '*x86_64*' -name '*.apk' | head -n1)" "$RUNNER_TEMP/apk/ghostly-debug-x86_64.apk"
          ls -l "$RUNNER_TEMP/apk"
          (cd "$RUNNER_TEMP/apk" && sha256sum ./*.apk)

      - name: Upload the arm64-v8a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostly-android-debug-arm64-v8a
          path: ${{ runner.temp }}/apk/ghostly-debug-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the x86_64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostly-android-debug-x86_64
          path: ${{ runner.temp }}/apk/ghostly-debug-x86_64.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Emulator smoke test (API 35, x86_64)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      # Only Playwright, which drives the app's WebView over adb (`_android`); no browser download.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Download the x86_64 APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghostly-android-debug-x86_64
          path: ${{ runner.temp }}/apk

      # The emulator needs hardware acceleration: KVM, which the runner has but does not open to its user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test and measurements
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SMOKE_APK: ${{ runner.temp }}/apk/ghostly-debug-x86_64.apk
          ANDROID_SMOKE_OUT: ${{ runner.temp }}/android-smoke
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: node tools/scripts/android-smoke.mjs

      - name: Results
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/android-smoke/results.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-smoke
          path: ${{ runner.temp }}/android-smoke
          retention-days: 14
