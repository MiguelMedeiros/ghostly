name: Release

on:
  push:
    tags:
      - "v*"
  # Security patch releases: security-autorelease.yml calls this with the tag
  # it created (a tag pushed with a workflow token triggers nothing by itself).
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.3.2"
        required: true
        type: string
      publish:
        description: "Publish the release instead of leaving a draft"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: false
        type: string

# Jobs that publish ask for more themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag being released, pushed or handed over by a caller.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ============================================
  # Everything a person can do still works, or nothing ships
  # ============================================
  e2e:
    name: End-to-end
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  # ============================================
  # Build Tauri App for all platforms
  # ============================================
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            # --verbose: linuxdeploy's own output in the log when the AppImage step fails.
            args: "--verbose"
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build Tauri (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # GStreamer's headers (calls on Linux, apps/desktop/src/native_call) need libunwind-dev, which the
          # runner image's libunwind-14-dev (LLVM's) blocks.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get update
          # The AppImage bundles GStreamer (bundleMediaFramework): linuxdeploy's GStreamer plugin copies the
          # plugins installed here, so the base and good plugins must be on the runner, and linuxdeploy
          # itself is an AppImage that needs FUSE 2.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libfuse2 \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install create-dmg

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-${{ github.repository }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the bundles the app updates itself with. The app installs
          # nothing that does not verify against the public key it was built with.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Updater bundles are made for releases only: an ordinary `tauri build`
          # needs no signing key (apps/desktop/tauri.release.conf.json).
          args: ${{ matrix.args }} --config apps/desktop/tauri.release.conf.json

      # Without this the AppImage shows a blank window on Wayland desktops (issue #1).
      - name: Drop bundled libwayland from AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y squashfs-tools
          scripts/appimage-drop-wayland-libs.sh target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-${{ matrix.name }}
          path: |
            target/*/release/bundle/**/*.dmg
            target/*/release/bundle/**/*.app
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/*/release/bundle/**/*.tar.gz
            target/*/release/bundle/**/*.zip
            target/*/release/bundle/**/*.sig
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip
            target/release/bundle/**/*.sig
          if-no-files-found: error

  # ============================================
  # Ghostly Browser (Chromium extension)
  # ============================================
  build-extension:
    runs-on: ubuntu-24.04
    name: Build browser extension

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:extension

      - name: Package
        run: |
          VERSION=$(node -p "require('./apps/extension/public/manifest.json').version")
          cd apps/extension/dist
          zip -r "../../ghostly-browser-extension-${VERSION}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          path: ghostly-browser-extension-*.zip

  # ============================================
  # Ghostly on the web (container image)
  # ============================================
  build-web:
    runs-on: ubuntu-24.04
    name: Build web image
    needs: [e2e]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghostly-web" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            GHOSTLY_BUILD=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.name }}:latest

  release:
    needs: [e2e, build-tauri, build-extension]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Only ours: the Docker build also uploads a build record that is not an archive
      # and makes an unfiltered download fail.
      - name: Download app artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "tauri-*"

      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: artifacts/extension

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Tauri apps
          find artifacts/tauri-* -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          
          # Browser extension (load unpacked, or upload to a store)
          cp artifacts/extension/*.zip release-assets/ 2>/dev/null || true

          # No CLI binaries: the Rust ghostly-cli was removed after 1.0
          # (S17 in docs/SECURITY-REVIEW.md). The supported CLI, packages/cli, goes to npm.

          ls -la release-assets/

      # What the desktop app reads to update itself. It also copies in the
      # bundles it points at; nothing unsigned ends up in the manifest.
      - name: Build the updater manifest
        run: node scripts/updater-manifest.mjs artifacts release-assets "${RELEASE_TAG}"

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          
          # Generate checksums for all files
          sha256sum * > SHA256SUMS.txt
          
          # Display checksums
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Import GPG key and sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd release-assets
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "Importing GPG key..."
            echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
            
            echo "Signing SHA256SUMS.txt..."
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --armor --detach-sign SHA256SUMS.txt
            
            echo "=== GPG Signature ==="
            ls -la SHA256SUMS.txt.asc
          else
            echo "GPG_PRIVATE_KEY not set, skipping GPG signing"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ !inputs.publish }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: release

      - name: Retry Release on failure
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ !inputs.publish }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
