name: Release

on:
  push:
    tags:
      - "v*"
  # Security patch releases: security-autorelease.yml calls this with the tag
  # it created (a tag pushed with a workflow token triggers nothing by itself).
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.3.2"
        required: true
        type: string
      publish:
        description: "Publish the release instead of leaving a draft"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: false
        type: string

# Jobs that publish ask for more themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag being released, pushed or handed over by a caller.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ============================================
  # Build Tauri App for all platforms
  # ============================================
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            args: ""
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build Tauri (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install create-dmg

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-${{ github.repository }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the frontend by Vite; GIFs work out of the box. Users can still set their own in Settings.
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-${{ matrix.name }}
          path: |
            target/*/release/bundle/**/*.dmg
            target/*/release/bundle/**/*.app
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error

  # ============================================
  # Build CLI for all platforms
  # ============================================
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            binary: ghostly-cli
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
            binary: ghostly-cli
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
            binary: ghostly-cli
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            binary: ghostly-cli.exe

    runs-on: ${{ matrix.platform }}
    name: Build CLI (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-cli-${{ github.repository }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-cli-${{ github.repository }}-

      - name: Build CLI
        run: cargo build --manifest-path cli/Cargo.toml --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # ============================================
  # Create GitHub Release
  # ============================================
  # ============================================
  # Ghostly Browser (Chromium extension)
  # ============================================
  build-extension:
    runs-on: ubuntu-latest
    name: Build browser extension

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: npm run build:extension

      - name: Package
        run: |
          VERSION=$(node -p "require('./extension/public/manifest.json').version")
          cd extension/dist
          zip -r "../../ghostly-browser-extension-${VERSION}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: ghostly-browser-extension-*.zip

  # ============================================
  # Ghostly on the web (container image)
  # ============================================
  build-web:
    runs-on: ubuntu-latest
    name: Build web image
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to the GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghostly-web" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_GIPHY_API_KEY=${{ secrets.VITE_GIPHY_API_KEY }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.name }}:latest

  release:
    needs: [build-tauri, build-cli, build-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Only ours: the Docker build also uploads a build record that is not an archive
      # and makes an unfiltered download fail.
      - name: Download app and CLI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: "{tauri,cli}-*"

      - name: Download extension artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension
          path: artifacts/extension

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Tauri apps
          find artifacts/tauri-* -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          
          # Browser extension (load unpacked, or upload to a store)
          cp artifacts/extension/*.zip release-assets/ 2>/dev/null || true

          # CLI binaries (rename with platform suffix)
          if [ -f "artifacts/cli-macOS-arm64/ghostly-cli" ]; then
            cp "artifacts/cli-macOS-arm64/ghostly-cli" "release-assets/ghostly-cli-macos-arm64"
          fi
          if [ -f "artifacts/cli-macOS-x64/ghostly-cli" ]; then
            cp "artifacts/cli-macOS-x64/ghostly-cli" "release-assets/ghostly-cli-macos-x64"
          fi
          if [ -f "artifacts/cli-Linux-x64/ghostly-cli" ]; then
            cp "artifacts/cli-Linux-x64/ghostly-cli" "release-assets/ghostly-cli-linux-x64"
          fi
          if [ -f "artifacts/cli-Windows-x64/ghostly-cli.exe" ]; then
            cp "artifacts/cli-Windows-x64/ghostly-cli.exe" "release-assets/ghostly-cli-windows-x64.exe"
          fi
          
          ls -la release-assets/

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          
          # Generate checksums for all files
          sha256sum * > SHA256SUMS.txt
          
          # Display checksums
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Import GPG key and sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd release-assets
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "Importing GPG key..."
            echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
            
            echo "Signing SHA256SUMS.txt..."
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --armor --detach-sign SHA256SUMS.txt
            
            echo "=== GPG Signature ==="
            ls -la SHA256SUMS.txt.asc
          else
            echo "GPG_PRIVATE_KEY not set, skipping GPG signing"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ !inputs.publish }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: release

      - name: Retry Release on failure
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ !inputs.publish }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
