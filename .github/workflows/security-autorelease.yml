name: Security autorelease

# The security routine (a scheduled Claude Code agent) pushes its fixes to a
# `claude/security-auto-*` branch, version already bumped by one patch. Once
# CI passes on that push, this workflow, which always runs from `main`, checks
# the branch against scripts/autorelease-gate.mjs, fast-forwards main to it,
# tags it and publishes the release.
#
# Repository variable SECURITY_AUTORELEASE: "all" (default: dependency and
# code fixes), "deps" (dependency updates only; code fixes wait for a person)
# or "off".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["claude/security-auto-**"]

permissions:
  contents: read

concurrency:
  group: security-autorelease
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      notes: ${{ steps.gate.outputs.notes }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check the branch
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MODE: ${{ vars.SECURITY_AUTORELEASE || 'all' }}
        run: node scripts/autorelease-gate.mjs

  merge:
    name: Merge and tag
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The gate made sure the branch sits right on top of main, so main moves
      # to it as a fast-forward: the routine's commits land as they are, with
      # no pull request (workflows may not open one in this repository). If
      # main moved meanwhile, the update is refused and nothing ships.
      - name: Fast-forward main and tag
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$HEAD_SHA" -F force=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$HEAD_SHA" >/dev/null
          # A pull request someone opened for the branch now shows as merged.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
          echo "main fast-forwarded to $HEAD_SHA, tagged v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: [gate, merge]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.gate.outputs.version }}
      publish: true
    secrets: inherit

  notes:
    name: Release notes
    needs: [gate, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Name and notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          NOTES: ${{ needs.gate.outputs.notes }}
        run: |
          set -euo pipefail
          # The marker is how the gate finds the previous automatic release.
          printf '%s\n\n%s\n\n%s\n' "$NOTES" "Security patch, released automatically. Checksums: SHA256SUMS.txt." "<!-- security-autorelease -->" > notes.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "Ghostly $VERSION" --notes-file notes.md --latest
