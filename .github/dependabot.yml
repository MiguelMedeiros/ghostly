# Security updates open on their own (they need "Dependabot security updates"
# on in the repository settings). The weekly version updates below are grouped
# so they arrive as a few pull requests, not dozens.
#
# Everything targets dev, where work lands; main only holds what is released
# (.github/CONTRIBUTING.md). Security updates still open against the default branch,
# which is dev as well.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    # typescript-eslint does not support TypeScript 7 yet; drop once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Fedimint adapter pins a canary of the web SDK exactly (docs/wisps/207-fedimint.md).
      # The stable 0.1.x (2025-10) is a year older, but semver ranks it above 0.0.0-canary;
      # drop once a stable release embeds fedimint 0.12 or later.
      - dependency-name: "@fedimint/*"
    groups:
      npm:
        patterns: ["*"]
        # hyperdht arrives alone, never in the weekly group: its four copies (this lockfile's two, the sidecar's
        # and the relay's below) and tools/patches/hyperdht+<version>.patch move in one pull request, by hand.
        exclude-patterns: [hyperdht]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/website
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    # typescript-eslint does not support TypeScript 7 yet; drop once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-config-next pulls eslint-plugin-react, which breaks on ESLint 10
      # (context.getFilename was removed); drop once it supports 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      website:
        patterns: ["*"]
        update-types: [minor, patch]
  # The Desktop's HyperDHT sidecar and the relay for browsers: lockfiles of their own, both shipped.
  # hyperdht itself moves with the root's: tools/patches/hyperdht+<version>.patch is by version, and
  # every copy runs the same one. Listing the update types keeps its security updates coming.
  - package-ecosystem: npm
    directory: /native/transports/hyperdht
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    ignore:
      - dependency-name: hyperdht
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      hyperdht-sidecar:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /infra/services/hyperdht-relay
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    ignore:
      - dependency-name: hyperdht
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      hyperdht-relay:
        patterns: ["*"]
        update-types: [minor, patch]
  # Test infrastructure (the e2e suite's AT Protocol network, never shipped): one pull request a
  # week for the whole folder, transitive packages included (that is where its advisories are),
  # and its security updates as one too.
  - package-ecosystem: npm
    directory: /e2e/infra/atproto
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    allow:
      - dependency-type: all
    groups:
      e2e-atproto:
        patterns: ["*"]
      e2e-atproto-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    # apps/desktop pins the versions Tauri's wry uses (src/fullscreen.rs takes wry's WebView2
    # controller). They move with a Tauri update, never on their own: a bump alone breaks
    # the Windows build.
    ignore:
      - dependency-name: webview2-com
      - dependency-name: windows-core
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  # Iroh for browsers, a crate outside the workspace. Security updates only: packages/iroh-web/pkg is
  # built from this lockfile and committed (tools/scripts/build-iroh-web.mjs), so any change to it
  # needs a rebuild by hand, and iroh moves with the Desktop's.
  - package-ecosystem: cargo
    directory: /native/transports/iroh-web
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
  # Node images stay on the major they name: an update offers the newest one, long-term or not (22 to 25
  # for the HyperDHT relay, a line that had already reached its end). A move to the next long-term
  # release is made by hand.
  - package-ecosystem: docker
    directories: [/apps/web, /apps/website, /e2e/infra/atproto, /infra/services/hyperdht-relay]
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
