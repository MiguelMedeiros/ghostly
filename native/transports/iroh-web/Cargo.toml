[package]
name = "ghostly-iroh-web"
version = "0.1.0"
edition = "2021"
publish = false

# Built for wasm32-unknown-unknown only (scripts/build-iroh-web.mjs). Kept out
# of the root workspace so native `cargo test` never compiles it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
