[package]
name = "ghostly"
version = "0.4.0"
edition = "2021"

[features]
# The macOS end-to-end tests' driver (src/e2e_driver.rs): debug builds only, never shipped.
e2e-driver = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghostly-transports = { path = "../native-transports" }
iroh = "=1.2.0"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pkarr = "8"
simple-dns = "0.12"
rand = "0.10"
base64 = "0.23"
crypto_secretbox = "0.1"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
tauri-plugin-notification = "2"
arboard = { version = "3.6.1", default-features = false }
tauri-plugin-dialog = "2"
sha2 = "0.10"
fs4 = { version = "0.13", features = ["sync"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSSharingService"] }
block2 = "0.6"
