# The relay as a service of its own, for a server (proposed: "zero", behind the Cloudflare tunnel as
# wss://hyperdht-relay.ghostly.tools). Not deployed; see README.md for what it costs and what it sees.
#   HYPERDHT_RELAY_BIND=192.168.0.57:49443 docker compose up -d --build
# Its defaults are zero's: clients counted by CF-Connecting-IP, and Ghostly's own app, extension and Desktop as the
# origins (the Desktop dials through the relay with "Hide my IP from contacts" on, from its webview: tauri://localhost
# on macOS and Linux, http://tauri.localhost on Windows and Android).
# Anywhere else, set GHOSTLY_RELAY_CLOUDFLARE=0 (with GHOSTLY_RELAY_PROXIES=1 behind one nginx or Caddy) and
# GHOSTLY_RELAY_ORIGINS to the origins of the app you serve (and the Desktop's two), in the shell or an .env file next to this one.
name: ghostly-hyperdht-relay
services:
  relay:
    build: .
    container_name: ghostly-hyperdht-relay
    restart: unless-stopped
    environment:
      GHOSTLY_RELAY_CLOUDFLARE: ${GHOSTLY_RELAY_CLOUDFLARE:-1}
      GHOSTLY_RELAY_PROXIES: ${GHOSTLY_RELAY_PROXIES:-0}
      GHOSTLY_RELAY_ORIGINS: ${GHOSTLY_RELAY_ORIGINS:-https://app.ghostly.tools,chrome-extension://nbedaagicniejlmfcncndfjcejaidbcf,tauri://localhost,http://tauri.localhost}
    ports: ["${HYPERDHT_RELAY_BIND:-127.0.0.1:49443}:49443"]
    # HyperDHT itself runs on UDP from inside the container (outgoing, holepunched): no UDP port to publish.
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "3" } }
