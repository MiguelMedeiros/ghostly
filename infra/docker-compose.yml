# Ghostly on the web, served as static files on http://localhost:8080. From the repository root:
#   docker compose -f infra/docker-compose.yml up --build -d
# Compose reads .env from this folder (infra/), not from the root: put GHOSTLY_WEB_BIND and the other settings
# in infra/.env, or pass a root one with --env-file .env.
# The project keeps the name "ghostly" (container ghostly-web-1), as when this file lived at the root.
name: ghostly
services:
  web:
    # Releases publish this image; `docker compose -f infra/docker-compose.yml pull` then `up -d` uses it as is.
    # `up --build` builds it from this checkout instead.
    image: ghcr.io/miguelmedeiros/ghostly-web:${GHOSTLY_WEB_TAG:-latest}
    build:
      # The repository root, whose .dockerignore applies; the Dockerfile path is from there.
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Which commit this build serves, for `/version.json`. There is no git
        # in the image: pass it in, or open tabs cannot tell one deploy from the next.
        GHOSTLY_BUILD: ${GHOSTLY_BUILD:-}
    ports:
      # Only this machine by default. Behind a reverse proxy or a tunnel on another
      # address, set e.g. GHOSTLY_WEB_BIND=0.0.0.0:8090 (the app itself needs HTTPS there).
      - "${GHOSTLY_WEB_BIND:-127.0.0.1:8080}:80"
    restart: unless-stopped
    # Docker keeps a container's output until it is removed: cap it at three files of 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
