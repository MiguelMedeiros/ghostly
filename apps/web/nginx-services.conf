# A contact's shared web app (apps/web/src/svc/): a host whose first label is 32 z-base-32 characters, under the
# services host the build was given (VITE_SERVICES_HOST). Only the bridge is served here, never the app: its pages,
# storage and keys belong to the app's own origin. Every other path is the contact's, answered by the services worker
# in the browser. A file of its own (conf.d/services.conf, read after default.conf and its log format), so the app's
# locations stay alone in nginx.conf. The Dockerfile adds `frame-ancestors <the app's origin>` when given one.
# Every location sends `Origin-Agent-Cluster: ?1` (ORIGIN_AGENT_CLUSTER in src/svc/protocol.ts): the apps' origins share
# this host's site, and each one keeps an agent cluster of its own.
server {
  listen 80;
  server_name "~^[ybndrfg8ejkmcpqxot1uwisza345h769]{32}\.";
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log ghostly;
  # Headers over nginx's limit (large_client_header_buffers) are answered as any other request, from the headers read
  # so far, not with a 400. A contact's app may set cookies for a domain above its own origin, as large and as many as
  # the browser takes: they reach every app's origin, and the bridge (and its clear of them) would never load again.
  # Through a named block (`error_page 494 = $uri;` still answers 400), which sends the path on to the block below that
  # matches it, with that block's headers.
  error_page 494 = @oversized_headers;
  # An answer of nginx's own (a 400 once the Host is read; before, nginx.conf's server answers) lets nothing load or run
  # from it, as the 404 below: it is a page of the app's origin, and an app's page that frames one would reach anywhere
  # through its window, under that page's policy alone. Here, not in a block below: a block's own add_header drops the
  # server's, and none of them takes these.
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Origin-Agent-Cluster "?1" always;

  location @oversized_headers {
    rewrite ^ $uri last;
  }

  location ~ ^/(ghostly-services-sw\.js|_ghostly-svc/bridge\.(html|js))$ {
    # The hashes: the clipboard guard (packages/core/src/clipboardGuard.ts), run inline by the bridge always, and the
    # WebRTC guard (packages/core/src/viewerGuard.ts), run inline by it with Hide my IP on.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-e02ru5vfXUoocznFuaOYi6mYSROzfSEW5rzBIFAYqN4=' 'sha256-SwvBbiKNvOB9YLHZtzwWYt9JbDfSuTxrsNmTzlCCMgI='; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Cache-Control "no-cache, no-transform";
    try_files $uri =404;
  }

  # The bridge drops every cookie of the services host's site here (src/svc/clearSite.ts): a page's script sees only
  # those whose path its URL is under, and a contact's app may set one for the whole host at any path.
  location = /_ghostly-svc/clear-cookies {
    add_header Clear-Site-Data '"cookies"' always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, no-transform" always;
    return 204;
  }

  location / {
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Origin-Agent-Cluster "?1" always;
    return 404;
  }
}
