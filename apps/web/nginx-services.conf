# A contact's shared web app (apps/web/src/svc/): a host whose first label is 32 z-base-32 characters, under the
# services host the build was given (VITE_SERVICES_HOST). Only the bridge is served here, never the app: its pages,
# storage and keys belong to the app's own origin. Every other path is the contact's, answered by the services worker
# in the browser. A file of its own (conf.d/services.conf, read after default.conf and its log format), so the app's
# locations stay alone in nginx.conf. The Dockerfile adds `frame-ancestors <the app's origin>` when given one.
server {
  listen 80;
  server_name "~^[ybndrfg8ejkmcpqxot1uwisza345h769]{32}\.";
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log ghostly;

  location ~ ^/(ghostly-services-sw\.js|_ghostly-svc/bridge\.(html|js))$ {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
