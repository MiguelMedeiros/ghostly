# Logs without personal data: no client address (nor the X-Forwarded-For or CF-Connecting-IP that carry it),
# no referrer, no user agent and no query string. $uri is the file answered after try_files, so an app route (or an
# invite code opened as a path) logs as /index.html. Enough to see what fails, not who asked.
log_format ghostly '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

# nginx writes the client address into every error line. At crit, the error lines of a static site (a 403 on a file,
# an oversized request) are left out: the access line still shows the path and status, only the reason is lost.
# Startup and configuration errors go to the image's main error log, which names no client.
error_log /var/log/nginx/error.log crit;

# Compressed here: every answer says no-transform (so the proxy writes nothing into the pages), and that also stops
# Cloudflare from compressing them, which left the app's 10 MB of scripts and styles to travel as they are. For every
# server (nginx-services.conf too), and behind Cloudflare's tunnel as well (gzip_proxied). text/html is always on.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;

# Whether the visitor came over plain http://. Cloudflare reaches this server through the tunnel whatever the visitor
# used, and says which it was in CF-Visitor (written by Cloudflare's edge alone; a request without it, straight to this
# server, is answered as before). Over http:// the app can't run (no secure context: no Web Crypto, no Web Locks, no
# service worker) and a browser ignores Strict-Transport-Security sent there.
map $http_cf_visitor $ghostly_plain_http {
  default 0;
  '~"scheme":"http"' 1;
}

server {
  # The app, for every other host name (nginx-services.conf's server is matched by its name only).
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /var/log/nginx/access.log ghostly;

  # A visit over http:// lands on the same address over https:// in one hop (the #fragment stays in the browser).
  if ($ghostly_plain_http) {
    return 301 https://$host$request_uri;
  }

  # Static files only: there is no Ghostly backend. The peer runs in the visitor's tab.

  # What a contact's app origin is served (nginx-services.conf), never the app's own.
  location ~ ^/(ghostly-services-sw\.js|_ghostly-svc/) {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
    try_files $uri =404;
  }

  # The service worker: always the server's copy (the browser compares it to find a new version).
  location = /sw.js {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cache-Control "no-cache, no-transform";
    try_files $uri =404;
  }

  # The mini-app runner (WISP 1200): an app's frame, with a policy of its own that sandboxes it, keeps it off the network
  # and lets only this site frame it. Not ghostly-headers.conf: two policies intersect, and the page's script-src 'self'
  # would stop the runner's inline script. The other headers are repeated here (apps/web/runnerPolicy.ts has the same).
  location = /app-frame.html {
    add_header Content-Security-Policy "sandbox allow-scripts allow-pointer-lock; default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache, no-transform";
    try_files $uri =404;
  }

  # The runner for an app the person granted `internet` (WISP 1200 · Permissions): the same file, with a policy that
  # lets it reach HTTPS and WSS servers and nothing else more (apps/web/runnerPolicy.ts has the same).
  location = /app-frame-net.html {
    add_header Content-Security-Policy "sandbox allow-scripts allow-pointer-lock; default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob: https:; media-src data: blob: https:; font-src data: https:; connect-src https: wss:; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache, no-transform";
    try_files /app-frame.html =404;
  }

  # What another app shares into the installed app is posted here and taken by the service worker. Without
  # one (not installed yet, or refused) the app opens instead of an error page.
  location = /share-target {
    return 303 /;
  }

  # Files a platform fetches from the domain (an Apple domain association, docs/OIDC-PROVIDERS.md), as JSON by
  # default. Only files that are there: without this, a missing one would be answered with index.html.
  location ^~ /.well-known/ {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cache-Control "no-cache, no-transform";
    default_type application/json;
    try_files $uri =404;
  }

  # Where an identity sign-in returns (`src/oidcCallback.ts`): opened by the provider's page in the popup the app made, which
  # the app closes when it is done. It keeps that window's ties, so no Cross-Origin-Opener-Policy here.
  # Every other block names the header itself (it is not in ghostly-headers.conf), so this is the only one without it.
  location = /oidc-callback.html {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cache-Control "no-cache, no-transform";
    try_files $uri =404;
  }

  # The app's pages. A page of another site that opened the app keeps no handle to its window, so it cannot set the
  # app's address again afterwards (an invite link per change). Windows the app opens itself (a sign-in) stay its own.
  location / {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cache-Control "no-cache, no-transform";
    try_files $uri /index.html;
  }
}
