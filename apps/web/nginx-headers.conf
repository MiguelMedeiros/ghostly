# nginx drops inherited add_header lines in any block that has its own, so every location includes these.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com https://giphy.com https://web.archive.org https://tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
# HTTPS only for a year once a browser has seen the site (Cloudflare serves it over HTTPS; this reaches it through the tunnel).
add_header Strict-Transport-Security "max-age=31536000" always;
