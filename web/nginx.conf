server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static files only: there is no Ghostly backend. The peer runs in the visitor's tab.

  location /assets/ {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/ghostly-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
