# A disposable Bitcoin regtest stack for the gated BDK tests: worthless coins, nothing public.
#   docker compose -p ghostly-bdk -f e2e/support/bdk-regtest/docker-compose.yml up -d
#   node e2e/support/bdk-regtest/regtest.mjs ready
# Host ports stay in 44200-44299; everything binds to 127.0.0.1.
name: ghostly-bdk
services:
  bitcoind:
    image: bitcoin/bitcoin:31.0
    container_name: ghostly-bdk-bitcoind
    command: ["bitcoind", "-regtest", "-printtoconsole", "-server", "-txindex", "-fallbackfee=0.0001",
      "-rpcbind=0.0.0.0", "-rpcallowip=0.0.0.0/0", "-rpcauth=ghostly:f718514868bbc04c8ae3c2bc19eb4d80$$248a6e9193bc8967207e2ada0bd98016b24ef579c135dc742f30b8c2a8b7bcfd"]
    ports: ["127.0.0.1:44201:18443"]
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=ghostly -rpcpassword=bdk getblockchaininfo || exit 1"]
      interval: 3s
      retries: 20
  # The BDK wallet in the browser speaks Esplora; electrs answers it (with CORS) from bitcoind.
  esplora:
    image: mempool/electrs:latest
    container_name: ghostly-bdk-esplora
    command: ["--network", "regtest", "--daemon-rpc-addr", "bitcoind:18443", "--cookie", "ghostly:bdk", "--jsonrpc-import",
      "--db-dir", "/tmp/electrs", "--http-addr", "0.0.0.0:3000", "--electrum-rpc-addr", "0.0.0.0:50001", "--cors", "*", "-v"]
    ports: ["127.0.0.1:44202:3000"]
    depends_on: { bitcoind: { condition: service_healthy } }
