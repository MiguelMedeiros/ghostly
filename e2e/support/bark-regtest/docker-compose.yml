# A disposable Bark (Second) regtest stack for the gated Bark tests: worthless coins, nothing public.
#   docker compose -p ghostly-bark -f e2e/support/bark-regtest/docker-compose.yml up -d
#   node e2e/support/bark-regtest/regtest.mjs ready
# Host ports stay in 44100-44199; everything binds to 127.0.0.1.
name: ghostly-bark
services:
  bitcoind:
    image: bitcoin/bitcoin:31.0
    container_name: ghostly-bark-bitcoind
    command: ["bitcoind", "-regtest", "-printtoconsole", "-server", "-txindex", "-fallbackfee=0.0001",
      "-rpcbind=0.0.0.0", "-rpcallowip=0.0.0.0/0", "-rpcauth=second:23f161a911aa7a75e5ac78a8d41d5313$$cae8671bb16c4e6ac6fcf3e98195bf0a5de8ee9ec536471df3f5caf97bc16437"]
    ports: ["127.0.0.1:44101:18443"]
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=second -rpcpassword=ark getblockchaininfo || exit 1"]
      interval: 3s
      retries: 20
  # The browser's on-chain wallet speaks Esplora; electrs answers it (with CORS) from bitcoind.
  esplora:
    image: mempool/electrs:latest
    container_name: ghostly-bark-esplora
    command: ["--network", "regtest", "--daemon-rpc-addr", "bitcoind:18443", "--cookie", "second:ark", "--jsonrpc-import",
      "--db-dir", "/tmp/electrs", "--http-addr", "0.0.0.0:3000", "--electrum-rpc-addr", "0.0.0.0:50001", "--cors", "*", "-v"]
    ports: ["127.0.0.1:44102:3000"]
    depends_on: { bitcoind: { condition: service_healthy } }
  # The Ark server, without Lightning. Its gRPC-web layer answers browsers directly.
  captaind:
    image: secondark/captaind:0.7.1
    platform: linux/amd64
    container_name: ghostly-bark-captaind
    environment: { CAPTAIND_CONFIG: /config/captaind.toml }
    volumes: ["./captaind.toml:/config/captaind.toml:ro", "captaind:/data/captaind", "postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:44135:3535"]
    depends_on: { bitcoind: { condition: service_healthy } }
  # A funder wallet (bark CLI) that boards regtest coins and pays the test wallets.
  funder:
    image: secondark/bark:0.7.1
    container_name: ghostly-bark-funder
    entrypoint: ["sleep", "infinity"]
    depends_on: [captaind]
volumes:
  captaind:
  postgres:
