# A disposable Lightning regtest stack for the gated NWC tests (GHOSTLY_NWC_REGTEST=1): worthless coins, nothing public.
# Two LND nodes with a channel alice -> bob, each behind its own Alby Hub that answers Nostr Wallet Connect (NIP-47)
# over a local strfry relay.
#   docker compose -p ghostly-nwc -f e2e/support/nwc-regtest/docker-compose.yml up -d
#   node e2e/support/nwc-regtest/regtest.mjs ready
#   docker compose -p ghostly-nwc -f e2e/support/nwc-regtest/docker-compose.yml down -v   (forget everything)
# Host ports stay in 44500-44579; everything binds to 127.0.0.1. Lightning P2P (9735) and gRPC (10009) stay inside.
name: ghostly-nwc
x-lnd: &lnd
  image: lightninglabs/lnd:v0.19.3-beta
  depends_on: { bitcoind: { condition: service_healthy } }
  healthcheck:
    test: ["CMD-SHELL", "lncli --network regtest getinfo || exit 1"]
    interval: 3s
    retries: 40
x-hub: &hub
  image: ghcr.io/getalby/hub:v1.24.0
  environment: &hub-env
    WORK_DIR: /data
    PORT: "8080"
    NETWORK: regtest
    RELAY: ws://relay:7777
    LN_BACKEND_TYPE: LND
    LND_CERT_FILE: /lnd/tls.cert
    LND_MACAROON_FILE: /lnd/data/chain/bitcoin/regtest/admin.macaroon
    # A test-only password guarding worthless regtest coins; it lets the hub restart without a manual unlock.
    AUTO_UNLOCK_PASSWORD: ghostly-nwc-regtest
    ENABLE_ADVANCED_SETUP: "false"
    SEND_EVENTS_TO_ALBY: "false"
    AUTO_LINK_ALBY_ACCOUNT: "false"
    HIDE_UPDATE_BANNER: "true"
    LOG_TO_FILE: "false"
services:
  bitcoind:
    image: bitcoin/bitcoin:31.0
    container_name: ghostly-nwc-bitcoind
    command: ["bitcoind", "-regtest", "-printtoconsole", "-server", "-txindex", "-fallbackfee=0.0001",
      "-zmqpubrawblock=tcp://0.0.0.0:28332", "-zmqpubrawtx=tcp://0.0.0.0:28333",
      "-rpcbind=0.0.0.0", "-rpcallowip=0.0.0.0/0", "-rpcauth=nwc:5f1e0c9a7b3d4e2f8a6c1b0d9e7f3a2c$$1c51c3af6f1aaa01bff11d70b01066c88c8d2675099d3296f5b0801a6f3e2bfa"]
    ports: ["127.0.0.1:44501:18443"]
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=nwc -rpcpassword=regtest getblockchaininfo || exit 1"]
      interval: 3s
      retries: 20
  # The Nostr relay both wallet services and the tests meet on (ws://relay:7777 inside, ws://127.0.0.1:44502 outside).
  relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: ghostly-nwc-relay
    volumes: ["./strfry.conf:/etc/strfry.conf:ro", "relay:/app/strfry-db"]
    ports: ["127.0.0.1:44502:7777"]
  lnd-alice:
    <<: *lnd
    container_name: ghostly-nwc-lnd-alice
    command: ["--configfile=/etc/lnd.conf", "--alias=alice", "--tlsextradomain=lnd-alice"]
    volumes: ["./lnd.conf:/etc/lnd.conf:ro", "lnd-alice:/root/.lnd"]
    ports: ["127.0.0.1:44511:8080"]
  lnd-bob:
    <<: *lnd
    container_name: ghostly-nwc-lnd-bob
    command: ["--configfile=/etc/lnd.conf", "--alias=bob", "--tlsextradomain=lnd-bob"]
    volumes: ["./lnd.conf:/etc/lnd.conf:ro", "lnd-bob:/root/.lnd"]
    ports: ["127.0.0.1:44512:8080"]
  # One Alby Hub per node: the NIP-47 wallet service a person pairs Ghostly with.
  hub-alice:
    <<: *hub
    container_name: ghostly-nwc-hub-alice
    environment: { <<: *hub-env, LND_ADDRESS: "lnd-alice:10009" }
    volumes: ["hub-alice:/data", "lnd-alice:/lnd:ro"]
    ports: ["127.0.0.1:44521:8080"]
    depends_on: { lnd-alice: { condition: service_healthy }, relay: { condition: service_started } }
  hub-bob:
    <<: *hub
    container_name: ghostly-nwc-hub-bob
    environment: { <<: *hub-env, LND_ADDRESS: "lnd-bob:10009" }
    volumes: ["hub-bob:/data", "lnd-bob:/lnd:ro"]
    ports: ["127.0.0.1:44522:8080"]
    depends_on: { lnd-bob: { condition: service_healthy }, relay: { condition: service_started } }
volumes:
  relay:
  lnd-alice:
  lnd-bob:
  hub-alice:
  hub-bob:
