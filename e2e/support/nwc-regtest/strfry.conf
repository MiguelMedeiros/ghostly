# strfry for the ghostly-nwc regtest stack: the defaults, reachable from the other containers and the host port.
db = "./strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    info {
        name = "ghostly-nwc regtest relay"
        description = "Disposable relay for the NWC regtest tests"
    }
}
